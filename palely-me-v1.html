<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>palely.me</title>
<meta name="description" content="창백한 우주, 나의 아카이브">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ══════════════════════════════════════
   palely.me — Design System
   Theme: Pale Cosmos + Snowfield
   ══════════════════════════════════════ */

:root {
  /* Palette — 창백한 우주 */
  --void: #08090f;
  --deep: #0e1019;
  --mist: #e4e7f1;
  --frost: #a3acd0;
  --silver: #6a7199;
  --aurora: #8fb8cb;
  --snow: #f2f4fa;
  --pale-glow: rgba(163, 172, 208, 0.08);
  --line-art: rgba(163, 172, 208, 0.06);

  /* Typography */
  --font-display: 'Cormorant Garamond', serif;
  --font-body: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --weight-light: 300;
  --weight-regular: 400;
  --weight-medium: 500;

  /* Spacing */
  --nav-width: 64px;
  --player-height: 72px;

  /* Transitions */
  --ease-out: cubic-bezier(0.25, 1, 0.25, 1);
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { 
  font-size: 15px; 
  scroll-behavior: smooth;
  /* 이미지 저장 차단 */
  -webkit-user-select: none;
  user-select: none;
}

/* 텍스트는 선택 허용 */
p, span, h1, h2, h3, h4, a, li, td, th, pre, code, textarea, input { 
  -webkit-user-select: text; 
  user-select: text; 
}

body {
  background: var(--void);
  color: var(--mist);
  font-family: var(--font-body);
  font-weight: var(--weight-light);
  min-height: 100vh;
  overflow: hidden;
  position: relative;
}

/* 이미지 드래그/우클릭 차단 (관리자 제외) */
img:not(.admin-allow) {
  pointer-events: none;
  -webkit-user-drag: none;
  user-drag: none;
}
body.is-admin img { pointer-events: auto; }

/* ── Canvas Background ── */
#particle-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ── Line Art Overlay ── */
.line-art-overlay {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}
.line-art-overlay svg {
  position: absolute;
  width: 100%;
  height: 100%;
}

/* ── Ambient Gradient ── */
.ambient-wash {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: 
    radial-gradient(ellipse 600px 400px at 15% 20%, rgba(143, 184, 203, 0.04) 0%, transparent 70%),
    radial-gradient(ellipse 500px 500px at 85% 75%, rgba(163, 172, 208, 0.03) 0%, transparent 70%),
    radial-gradient(ellipse 800px 300px at 50% 100%, rgba(106, 113, 153, 0.05) 0%, transparent 60%);
}

/* ══════════════════════════════════════
   Navigation — Left Dock
   ══════════════════════════════════════ */
.nav-dock {
  position: fixed;
  left: 0;
  top: 0;
  width: var(--nav-width);
  height: calc(100vh - var(--player-height));
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 0 20px;
  z-index: 100;
  border-right: 1px solid var(--line-art);
}

.nav-logo {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: var(--weight-light);
  font-style: italic;
  color: var(--frost);
  letter-spacing: 0.02em;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  margin-bottom: 40px;
  opacity: 0.6;
  transition: opacity 0.4s;
  cursor: default;
}
.nav-logo:hover { opacity: 1; }

.nav-items {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  flex: 1;
}

.nav-item {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  opacity: 0.3;
  transition: opacity 0.4s var(--ease-out), transform 0.3s var(--ease-out);
  border: none;
  background: none;
  color: var(--frost);
}
.nav-item:hover { opacity: 0.7; transform: scale(1.1); }
.nav-item.active { opacity: 1; }
.nav-item.active::before {
  content: '';
  position: absolute;
  left: -12px;
  width: 2px;
  height: 20px;
  background: var(--frost);
  border-radius: 1px;
  box-shadow: 0 0 8px var(--aurora);
}
.nav-item svg { width: 18px; height: 18px; fill: currentColor; }

.nav-item .tooltip {
  position: absolute;
  left: calc(100% + 14px);
  top: 50%;
  transform: translateY(-50%) translateX(-4px);
  background: rgba(14, 16, 25, 0.95);
  border: 1px solid rgba(163, 172, 208, 0.12);
  backdrop-filter: blur(12px);
  color: var(--mist);
  font-size: 11px;
  letter-spacing: 0.08em;
  padding: 6px 12px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s var(--ease-out);
  font-family: var(--font-body);
}
.nav-item:hover .tooltip { opacity: 1; transform: translateY(-50%) translateX(0); }

/* ══════════════════════════════════════
   Main Content Area
   ══════════════════════════════════════ */
.main-content {
  position: relative;
  margin-left: var(--nav-width);
  height: calc(100vh - var(--player-height));
  overflow-y: auto;
  overflow-x: hidden;
  z-index: 10;
  scroll-behavior: smooth;
}
.main-content::-webkit-scrollbar { width: 2px; }
.main-content::-webkit-scrollbar-track { background: transparent; }
.main-content::-webkit-scrollbar-thumb { background: rgba(163, 172, 208, 0.15); border-radius: 1px; }

/* Page Sections */
.page-section {
  display: none;
  min-height: 100%;
  padding: 60px 80px;
  animation: fadeIn 0.6s var(--ease-out);
}
.page-section.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── Home Section ── */
.home-section {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  min-height: 100%;
  position: relative;
}

.home-title {
  font-family: var(--font-display);
  font-size: clamp(48px, 8vw, 96px);
  font-weight: var(--weight-light);
  font-style: italic;
  color: var(--snow);
  letter-spacing: -0.03em;
  line-height: 1;
  margin-bottom: 20px;
  opacity: 0;
  animation: titleReveal 1.2s var(--ease-out) 0.3s forwards;
}
@keyframes titleReveal {
  from { opacity: 0; transform: translateY(20px) scale(0.98); letter-spacing: 0.1em; }
  to { opacity: 1; transform: translateY(0) scale(1); letter-spacing: -0.03em; }
}

.home-subtitle {
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--frost);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  opacity: 0;
  animation: subtitleReveal 1s var(--ease-out) 0.8s forwards;
}
@keyframes subtitleReveal {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 0.5; transform: translateY(0); }
}

.home-line-divider {
  width: 60px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--frost), transparent);
  margin: 28px auto;
  opacity: 0;
  animation: lineReveal 1.2s var(--ease-out) 1.1s forwards;
}
@keyframes lineReveal {
  from { opacity: 0; width: 0; }
  to { opacity: 0.3; width: 60px; }
}

.home-desc {
  font-size: 13px;
  color: var(--silver);
  letter-spacing: 0.05em;
  line-height: 1.8;
  max-width: 360px;
  opacity: 0;
  animation: subtitleReveal 1s var(--ease-out) 1.4s forwards;
}

/* ── Board Sections (공통) ── */
.section-header {
  margin-bottom: 48px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--line-art);
}
.section-title {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: var(--weight-light);
  font-style: italic;
  color: var(--snow);
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}
.section-subtitle {
  font-size: 11px;
  color: var(--silver);
  letter-spacing: 0.25em;
  text-transform: uppercase;
}

/* Board Grid */
.board-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

.board-card {
  background: rgba(14, 16, 25, 0.6);
  border: 1px solid rgba(163, 172, 208, 0.06);
  backdrop-filter: blur(8px);
  padding: 24px;
  cursor: pointer;
  transition: all 0.4s var(--ease-out);
  position: relative;
  overflow: hidden;
}
.board-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--frost), transparent);
  opacity: 0;
  transition: opacity 0.4s;
}
.board-card:hover {
  border-color: rgba(163, 172, 208, 0.15);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}
.board-card:hover::before { opacity: 0.4; }

.card-date {
  font-size: 10px;
  color: var(--silver);
  letter-spacing: 0.15em;
  margin-bottom: 12px;
  font-family: var(--font-body);
}
.card-title {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: var(--weight-regular);
  color: var(--mist);
  margin-bottom: 8px;
  line-height: 1.3;
}
.card-excerpt {
  font-size: 12.5px;
  color: var(--silver);
  line-height: 1.7;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-tag {
  display: inline-block;
  font-size: 10px;
  color: var(--frost);
  border: 1px solid rgba(163, 172, 208, 0.12);
  padding: 3px 8px;
  margin-top: 12px;
  letter-spacing: 0.08em;
}

/* ── Prompt Board — 원클릭 복사 ── */
.prompt-card {
  background: rgba(14, 16, 25, 0.6);
  border: 1px solid rgba(163, 172, 208, 0.06);
  padding: 20px;
  position: relative;
  transition: all 0.4s var(--ease-out);
}
.prompt-card:hover { border-color: rgba(163, 172, 208, 0.15); }

.prompt-text {
  font-family: 'Pretendard', monospace;
  font-size: 12px;
  color: var(--frost);
  line-height: 1.7;
  letter-spacing: 0.01em;
  white-space: pre-wrap;
  word-break: break-all;
}
.prompt-copy-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(163, 172, 208, 0.08);
  border: 1px solid rgba(163, 172, 208, 0.1);
  color: var(--frost);
  font-size: 10px;
  letter-spacing: 0.1em;
  padding: 5px 10px;
  cursor: pointer;
  transition: all 0.3s;
  font-family: var(--font-body);
}
.prompt-copy-btn:hover { background: rgba(163, 172, 208, 0.15); color: var(--snow); }
.prompt-copy-btn.copied { color: var(--aurora); border-color: var(--aurora); }

/* ── Image Grid (에셋/배너) ── */
.image-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}
.image-grid-item {
  aspect-ratio: 1;
  background: var(--deep);
  border: 1px solid var(--line-art);
  overflow: hidden;
  position: relative;
  cursor: pointer;
  transition: all 0.4s var(--ease-out);
}
.image-grid-item:hover { border-color: rgba(163, 172, 208, 0.2); transform: scale(1.02); }
.image-grid-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.9;
  transition: opacity 0.4s;
}
.image-grid-item:hover img { opacity: 1; }

/* ── Empty State ── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  text-align: center;
}
.empty-state-icon {
  width: 48px;
  height: 48px;
  margin-bottom: 20px;
  opacity: 0.15;
}
.empty-state-text {
  font-size: 13px;
  color: var(--silver);
  letter-spacing: 0.05em;
}

/* ══════════════════════════════════════
   Music Player — Bottom Bar (PMB 연동)
   ══════════════════════════════════════ */
.music-player {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--player-height);
  background: rgba(8, 9, 15, 0.92);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--line-art);
  display: flex;
  align-items: center;
  padding: 0 24px 0 calc(var(--nav-width) + 24px);
  gap: 20px;
  z-index: 200;
}

.player-album-art {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--deep);
  border: 1px solid rgba(163, 172, 208, 0.08);
  overflow: hidden;
  flex-shrink: 0;
  position: relative;
}
.player-album-art.spinning { animation: lp-spin 8s linear infinite; }
@keyframes lp-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.player-album-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.player-album-art::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 8px;
  height: 8px;
  background: var(--void);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  border: 1px solid rgba(163, 172, 208, 0.1);
}

.player-info {
  flex: 0 0 180px;
  min-width: 0;
}
.player-track-name {
  font-size: 12.5px;
  color: var(--mist);
  font-weight: var(--weight-regular);
  letter-spacing: -0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.player-playlist-name {
  font-size: 10px;
  color: var(--silver);
  letter-spacing: 0.08em;
  margin-top: 2px;
}

.player-controls {
  display: flex;
  align-items: center;
  gap: 18px;
}
.player-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--frost);
  opacity: 0.4;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.player-btn:hover { opacity: 0.9; transform: scale(1.1); }
.player-btn svg { width: 16px; height: 16px; fill: currentColor; }
.player-btn.play-btn svg { width: 22px; height: 22px; }
.player-btn.active { opacity: 1; color: var(--aurora); }

.player-progress-area {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.player-time {
  font-size: 10px;
  color: var(--silver);
  letter-spacing: 0.05em;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
  width: 36px;
  text-align: center;
}
.player-progress-bar {
  flex: 1;
  height: 20px;
  display: flex;
  align-items: center;
  cursor: pointer;
  position: relative;
}
.player-progress-track {
  width: 100%;
  height: 1.5px;
  background: rgba(163, 172, 208, 0.1);
  position: relative;
  pointer-events: none;
}
.player-progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--frost), var(--aurora));
  position: relative;
  transition: width 0.25s linear;
  box-shadow: 0 0 6px rgba(143, 184, 203, 0.3);
}
.player-progress-fill::after {
  content: '';
  position: absolute;
  right: -3px;
  top: 50%;
  width: 6px;
  height: 6px;
  background: var(--aurora);
  transform: translateY(-50%) rotate(45deg);
  box-shadow: 0 0 8px var(--aurora);
  opacity: 0;
  transition: opacity 0.3s;
}
.player-progress-bar:hover .player-progress-fill::after { opacity: 1; }

.player-volume {
  display: flex;
  align-items: center;
  gap: 8px;
  opacity: 0.4;
  transition: opacity 0.3s;
}
.player-volume:hover { opacity: 1; }
.player-volume svg { width: 14px; height: 14px; fill: var(--frost); flex-shrink: 0; }
.player-volume input[type="range"] {
  -webkit-appearance: none;
  width: 60px;
  height: 1.5px;
  background: rgba(163, 172, 208, 0.15);
  outline: none;
  cursor: pointer;
}
.player-volume input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 6px;
  height: 6px;
  background: var(--frost);
  transform: rotate(45deg);
  cursor: pointer;
}

/* ── Toast ── */
.toast-container {
  position: fixed;
  bottom: calc(var(--player-height) + 16px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 999;
}
.toast-msg {
  background: rgba(14, 16, 25, 0.92);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(163, 172, 208, 0.12);
  color: var(--mist);
  font-size: 11px;
  letter-spacing: 0.1em;
  padding: 10px 20px;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.4s var(--ease-out);
  pointer-events: none;
}
.toast-msg.show { opacity: 1; transform: translateY(0); }

/* ── Responsive ── */
@media (max-width: 768px) {
  :root { --nav-width: 0px; }
  .nav-dock { display: none; }
  .page-section { padding: 40px 24px; }
  .music-player { padding: 0 16px; }
  .player-info { flex: 0 0 120px; }
  .player-volume { display: none; }
  .board-grid { grid-template-columns: 1fr; }
  .image-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  
  /* 모바일 하단 네비 */
  .mobile-nav {
    display: flex !important;
    position: fixed;
    bottom: var(--player-height);
    left: 0;
    right: 0;
    height: 52px;
    background: rgba(8, 9, 15, 0.95);
    border-top: 1px solid var(--line-art);
    z-index: 150;
    align-items: center;
    justify-content: space-around;
  }
  .main-content { height: calc(100vh - var(--player-height) - 52px); margin-left: 0; }
}
.mobile-nav { display: none; }

/* ── Reduced Motion ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  .player-album-art.spinning { animation: none; }
  #particle-canvas { display: none; }
}
</style>
</head>
<body>
<!-- Particle Canvas (눈/별 파티클) -->
<canvas id="particle-canvas"></canvas>

<!-- Line Art SVG Overlay -->
<div class="line-art-overlay">
  <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="line-fade" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="rgba(163,172,208,0.04)"/>
        <stop offset="100%" stop-color="rgba(143,184,203,0.02)"/>
      </linearGradient>
    </defs>
    <!-- 기하학적 라인아트 — 별자리 / 설원 지형선 -->
    <g stroke="url(#line-fade)" stroke-width="0.5" fill="none">
      <!-- 상단 별자리 라인 -->
      <polyline points="120,80 280,140 350,60 520,120 480,200"/>
      <polyline points="1400,100 1520,60 1600,130 1750,90"/>
      <circle cx="280" cy="140" r="2" fill="rgba(163,172,208,0.06)"/>
      <circle cx="520" cy="120" r="1.5" fill="rgba(163,172,208,0.05)"/>
      <circle cx="1520" cy="60" r="2" fill="rgba(163,172,208,0.06)"/>
      <!-- 하단 설원 지형선 -->
      <path d="M0,950 Q200,920 400,940 T800,930 T1200,945 T1600,925 T1920,940" opacity="0.5"/>
      <path d="M0,980 Q300,960 600,975 T1200,965 T1920,975" opacity="0.3"/>
    </g>
    <!-- 동심원 장식 -->
    <g stroke="rgba(163,172,208,0.03)" fill="none">
      <circle cx="960" cy="540" r="300" stroke-width="0.5"/>
      <circle cx="960" cy="540" r="320" stroke-width="0.3" stroke-dasharray="4 12"/>
    </g>
  </svg>
</div>

<!-- Ambient Wash -->
<div class="ambient-wash"></div>

<!-- ═══ Navigation Dock ═══ -->
<nav class="nav-dock">
  <div class="nav-logo">p</div>
  <div class="nav-items">

/* ══════════════════════════════════════

// ── SPA Router ──
function navigate(page) {
  document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

  const target = document.getElementById('page-' + page);
  if (target) {
    target.classList.add('active');
    // Re-trigger animation
    target.style.animation = 'none';
    target.offsetHeight;
    target.style.animation = '';
  }

  document.querySelectorAll(`.nav-item[data-page="${page}"]`).forEach(n => n.classList.add('active'));
  document.getElementById('main-content').scrollTop = 0;
  window.location.hash = page;
}

// Hash-based routing
window.addEventListener('hashchange', () => {
  const page = window.location.hash.slice(1) || 'home';
  navigate(page);
});

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── Image Protection ──
document.addEventListener('contextmenu', (e) => {
  if (e.target.tagName === 'IMG' && !document.body.classList.contains('is-admin')) {
    e.preventDefault();
    showToast('이미지 저장이 제한됩니다');
  }
});

// ── Prompt Copy ──
function copyPrompt(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'COPIED';
    btn.classList.add('copied');
    showToast('클립보드에 복사됨');
    setTimeout(() => {
      btn.textContent = 'COPY';
      btn.classList.remove('copied');
    }, 1500);
  });
}

/* ══════════════════════════════════════
   Particle System — 눈/별 파티클
   ══════════════════════════════════════ */
(function initParticles() {
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // 파티클 타입: star(별빛 반짝임) + snow(눈 낙하)
  function createParticle(type) {
    if (type === 'star') {
      return {
        type: 'star',
        x: Math.random() * W,
        y: Math.random() * H,
        size: Math.random() * 1.5 + 0.5,
        alpha: Math.random() * 0.4,
        alphaTarget: Math.random() * 0.6 + 0.1,
        speed: Math.random() * 0.005 + 0.002,
        phase: Math.random() * Math.PI * 2
      };
    } else {
      return {
        type: 'snow',
        x: Math.random() * W,
        y: -10,
        size: Math.random() * 2 + 0.5,
        alpha: Math.random() * 0.25 + 0.05,
        speedY: Math.random() * 0.3 + 0.1,
        speedX: Math.random() * 0.2 - 0.1,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: Math.random() * 0.01 + 0.005
      };
    }
  }

  // 초기 파티클 생성
  for (let i = 0; i < 120; i++) particles.push(createParticle('star'));
  for (let i = 0; i < 40; i++) {
    const p = createParticle('snow');
    p.y = Math.random() * H; // 초기 분포
    particles.push(p);
  }

  function animate() {
    ctx.clearRect(0, 0, W, H);
    
    particles.forEach(p => {
      if (p.type === 'star') {
        // 별빛 반짝임
        p.phase += p.speed;
        p.alpha += (p.alphaTarget - p.alpha) * 0.01;
        if (Math.random() < 0.002) p.alphaTarget = Math.random() * 0.6 + 0.1;
        
        const flicker = Math.sin(p.phase) * 0.5 + 0.5;
        ctx.globalAlpha = p.alpha * flicker;
        ctx.fillStyle = '#c8d0e8';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      } else {
        // 눈 낙하
        p.wobble += p.wobbleSpeed;
        p.x += p.speedX + Math.sin(p.wobble) * 0.15;
        p.y += p.speedY;
        
        if (p.y > H + 10) { p.y = -10; p.x = Math.random() * W; }
        if (p.x < -10) p.x = W + 10;
        if (p.x > W + 10) p.x = -10;
        
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = '#e4e7f1';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    });
    
    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
  }
  animate();
})();

/* ══════════════════════════════════════
   Music Player — PMB Supabase 연동
   YouTube IFrame API 기반
   ══════════════════════════════════════ */
const PMB_SUPABASE_URL = 'https://zrfasztpsmprfpslizac.supabase.co';
const PMB_SUPABASE_KEY = 'sb_publishable_z7m5HVzuiUhBzRKIAuOKZQ_y4PFw-6B';

let pmbClient = null;
let ytPlayer = null;
let pmbTracks = [];
let pmbCurrentIdx = -1;
let pmbIsPlaying = false;
let pmbIsShuffling = false;
let pmbPlayedSet = {};
let pmbPlaylistMeta = null;
let pmbProgressInterval = null;

// Supabase 초기화
function initPMB() {
  try {
    if (window.supabase) {
      pmbClient = window.supabase.createClient(PMB_SUPABASE_URL, PMB_SUPABASE_KEY);
      loadDefaultPlaylist();
    }
  } catch(e) { console.log('PMB init:', e); }
}

// 기본 플레이리스트 로드 (첫 번째 public 플레이리스트)
async function loadDefaultPlaylist() {
  if (!pmbClient) return;
  try {
    // 공개 플레이리스트 중 첫 번째 로드
    const { data: playlists } = await pmbClient
      .from('playlists')
      .select('*')
      .limit(1);
    
    if (playlists && playlists.length > 0) {
      const pl = playlists[0];
      pmbPlaylistMeta = pl;
      document.getElementById('player-playlist-name').textContent = pl.pair_name || 'Pair Music Box';
      
      // 트랙 로드
      const { data: tracks } = await pmbClient
        .from('tracks')
        .select('*')
        .eq('playlist_id', pl.id)
        .order('position');
      
      if (tracks && tracks.length > 0) {
        pmbTracks = tracks.map(t => ({
          id: t.id,
          videoId: t.video_id,
          title: t.title,
          image: t.image_url || null
        }));
        // 자동재생
        pmbPlayTrack(0);
      }
    }
  } catch(e) { console.log('PMB load:', e); }
}

// YouTube IFrame API
function loadYTAPI() {
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
}
loadYTAPI();

window.onYouTubeIframeAPIReady = function() {
  ytPlayer = new YT.Player('yt-player-container', {
    height: '0',
    width: '0',
    playerVars: { playsinline: 1 },
    events: {
      onReady: function() {
        const v = document.getElementById('player-volume-slider');
        if (v && ytPlayer) ytPlayer.setVolume(parseInt(v.value));
        initPMB();
      },
      onStateChange: onYTStateChange
    }
  });
};

function onYTStateChange(event) {
  const art = document.getElementById('player-art');
  const iconPlay = document.getElementById('p-icon-play');
  const iconPause = document.getElementById('p-icon-pause');

  if (event.data === YT.PlayerState.PLAYING) {
    pmbIsPlaying = true;
    art.classList.add('spinning');
    iconPlay.style.display = 'none';
    iconPause.style.display = 'block';
    startPmbProgress();
  } else {
    pmbIsPlaying = false;
    art.classList.remove('spinning');
    iconPlay.style.display = 'block';
    iconPause.style.display = 'none';
    clearInterval(pmbProgressInterval);
  }

  if (event.data === YT.PlayerState.ENDED) {
    playerNext();
  }
}

function startPmbProgress() {
  clearInterval(pmbProgressInterval);
  pmbProgressInterval = setInterval(() => {
    if (ytPlayer && pmbIsPlaying && ytPlayer.getCurrentTime) {
      try {
        const cur = ytPlayer.getCurrentTime();
        const dur = ytPlayer.getDuration();
        if (dur > 0) {
          document.getElementById('player-progress-fill').style.width = (cur / dur * 100) + '%';
          document.getElementById('player-time-cur').textContent = fmtTime(cur);
          document.getElementById('player-time-dur').textContent = fmtTime(dur);
        }
      } catch(e) {}
    }
  }, 250);
}

function fmtTime(s) {
  if (!s) return '0:00';
  const m = Math.floor(s / 60);
  const ss = Math.floor(s % 60);
  return m + ':' + (ss < 10 ? '0' : '') + ss;
}

function pmbPlayTrack(idx) {
  if (idx < 0 || idx >= pmbTracks.length) return;
  pmbCurrentIdx = idx;
  const t = pmbTracks[idx];

  if (ytPlayer && ytPlayer.loadVideoById) ytPlayer.loadVideoById(t.videoId);

  document.getElementById('player-track-name').textContent = t.title;

  // 앨범아트 업데이트
  const artEl = document.getElementById('player-art');
  const img = t.image || (t.videoId ? 'https://img.youtube.com/vi/' + t.videoId + '/mqdefault.jpg' : '');
  if (img) {
    artEl.innerHTML = '<img class="player-album-img" src="' + img + '" alt="" draggable="false">';
  }
}

function playerToggle() {
  if (pmbCurrentIdx === -1 && pmbTracks.length > 0) {
    pmbPlayTrack(0);
  } else if (ytPlayer && ytPlayer.getPlayerState) {
    pmbIsPlaying ? ytPlayer.pauseVideo() : ytPlayer.playVideo();
  }
}

function playerNext() {
  if (!pmbTracks.length) return;
  let next;
  if (pmbIsShuffling) {
    const avail = [];
    for (let i = 0; i < pmbTracks.length; i++) {
      if (i !== pmbCurrentIdx && !pmbPlayedSet[i]) avail.push(i);
    }
    if (avail.length === 0) {
      pmbPlayedSet = {};
      for (let i = 0; i < pmbTracks.length; i++) {
        if (i !== pmbCurrentIdx) avail.push(i);
      }
    }
    next = avail[Math.floor(Math.random() * avail.length)];
  } else {
    next = (pmbCurrentIdx + 1) % pmbTracks.length;
  }
  pmbPlayedSet[next] = true;
  pmbPlayTrack(next);
}

function playerPrev() {
  if (pmbTracks.length) {
    pmbPlayTrack((pmbCurrentIdx - 1 + pmbTracks.length) % pmbTracks.length);
  }
}

function playerToggleShuffle() {
  pmbIsShuffling = !pmbIsShuffling;
  pmbPlayedSet = {};
  const btn = document.getElementById('player-shuffle-btn');
  btn.classList.toggle('active', pmbIsShuffling);
  showToast(pmbIsShuffling ? '셔플 ON' : '셔플 OFF');
}

function playerSetVolume(val) {
  if (ytPlayer && ytPlayer.setVolume) ytPlayer.setVolume(parseInt(val));
}

// Progress bar seek
document.getElementById('player-progress-bar').addEventListener('mousedown', function(e) {
  seekFromEvent(e);
  const move = (ev) => seekFromEvent(ev);
  const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
});

function seekFromEvent(e) {
  const bar = document.getElementById('player-progress-bar');
  const rect = bar.getBoundingClientRect();
  let pct = (e.clientX - rect.left) / rect.width;
  pct = Math.max(0, Math.min(1, pct));
  document.getElementById('player-progress-fill').style.width = (pct * 100) + '%';
  if (ytPlayer && ytPlayer.getDuration) {
    ytPlayer.seekTo(ytPlayer.getDuration() * pct, true);
  }
}

// ── Init ──
window.addEventListener('DOMContentLoaded', () => {
  const hash = window.location.hash.slice(1);
  if (hash) navigate(hash);
});
</script>
