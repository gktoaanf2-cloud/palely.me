    x:Math.random()*W,y:Math.random()*H,
    r:bright?(Math.random()*1.0+0.6):(Math.random()*0.8+0.2),
    dx:(Math.random()-.5)*.12,dy:(Math.random()-.5)*.08,
    a:bright?(Math.random()*.4+.3):(Math.random()*.3+.06),
    p:Math.random()*6.28,
    s:bright?(Math.random()*.025+.012):(Math.random()*.01+.004),
    bright:bright
  });
}
!function d(){
  x.clearRect(0,0,W,H);
  for(var i=0;i<P.length;i++){
    var q=P[i];q.x+=q.dx;q.y+=q.dy;q.p+=q.s;
    if(q.x<-10)q.x=W+10;if(q.x>W+10)q.x=-10;if(q.y<-10)q.y=H+10;if(q.y>H+10)q.y=-10;
    var tw=q.a*(0.45+0.55*Math.sin(q.p)); // stronger twinkle range
    if(q.bright){
      // glow halo
      var g=x.createRadialGradient(q.x,q.y,0,q.x,q.y,q.r*2.8);
      g.addColorStop(0,"rgba(255,255,255,"+(tw*0.9)+")");
      g.addColorStop(0.4,"rgba(200,220,255,"+(tw*0.35)+")");
      g.addColorStop(1,"rgba(255,255,255,0)");
      x.fillStyle=g;
      x.beginPath();x.arc(q.x,q.y,q.r*2.8,0,6.28);x.fill();
      // bright core
      x.fillStyle="rgba(255,255,255,"+tw+")";
      x.beginPath();x.arc(q.x,q.y,q.r,0,6.28);x.fill();
      // sparkle cross for brightest moments
      if(tw>0.72){
        x.strokeStyle="rgba(255,255,255,"+((tw-0.72)*1.0)+")";
        x.lineWidth=0.6;
        var L=q.r*3.2;
        x.beginPath();
        x.moveTo(q.x-L,q.y);x.lineTo(q.x+L,q.y);
        x.moveTo(q.x,q.y-L);x.lineTo(q.x,q.y+L);
        x.stroke();
      }
    }else{
      x.fillStyle="rgba(255,255,255,"+tw+")";
      x.beginPath();x.arc(q.x,q.y,q.r,0,6.28);x.fill();
    }
  }
  requestAnimationFrame(d);
}();
}();

function goHome(){
  document.querySelector(".overlay").classList.add("active");
  setTimeout(function(){location.href="/home"},900);
}
document.getElementById("text-small").addEventListener("click",goHome);
document.getElementById("star-outline").addEventListener("click",goHome);
document.getElementById("star-outline").style.cursor="pointer";
