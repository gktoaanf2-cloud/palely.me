<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>palely.me</title>
<meta name="description" content="창백한 우주, 나의 아카이브">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --void: #08090f;
  --deep: #0e1019;
  --mist: #e4e7f1;
  --frost: #a3acd0;
  --silver: #6a7199;
  --aurora: #8fb8cb;
  --snow: #f2f4fa;
  --pale-glow: rgba(163, 172, 208, 0.08);
  --line-art: rgba(163, 172, 208, 0.06);
  --danger: #c47070;
  --font-display: 'Cormorant Garamond', serif;
  --font-body: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --weight-light: 300;
  --weight-regular: 400;
  --weight-medium: 500;
  --nav-width: 64px;
  --player-height: 72px;
  --ease-out: cubic-bezier(0.25, 1, 0.25, 1);
  --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; scroll-behavior: smooth; -webkit-user-select: none; user-select: none; }
p, span, h1, h2, h3, h4, a, li, td, th, pre, code, textarea, input, label { -webkit-user-select: text; user-select: text; }
body { background: var(--void); color: var(--mist); font-family: var(--font-body); font-weight: var(--weight-light); min-height: 100vh; overflow: hidden; position: relative; }
img:not(.admin-allow) { pointer-events: none; -webkit-user-drag: none; }
body.is-admin img { pointer-events: auto; }
#particle-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.line-art-overlay { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.line-art-overlay svg { position: absolute; width: 100%; height: 100%; }
.ambient-wash { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse 600px 400px at 15% 20%, rgba(143,184,203,0.04) 0%, transparent 70%), radial-gradient(ellipse 500px 500px at 85% 75%, rgba(163,172,208,0.03) 0%, transparent 70%), radial-gradient(ellipse 800px 300px at 50% 100%, rgba(106,113,153,0.05) 0%, transparent 60%); }

/* Navigation */
.nav-dock { position: fixed; left: 0; top: 0; width: var(--nav-width); height: calc(100vh - var(--player-height)); display: flex; flex-direction: column; align-items: center; padding: 28px 0 20px; z-index: 100; border-right: 1px solid var(--line-art); }
.nav-logo { font-family: var(--font-display); font-size: 18px; font-weight: var(--weight-light); font-style: italic; color: var(--frost); writing-mode: vertical-rl; text-orientation: mixed; margin-bottom: 40px; opacity: 0.6; transition: opacity 0.4s; cursor: default; }
.nav-logo:hover { opacity: 1; }
.nav-items { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }
.nav-item { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; opacity: 0.3; transition: opacity 0.4s var(--ease-out), transform 0.3s var(--ease-out); border: none; background: none; color: var(--frost); }
.nav-item:hover { opacity: 0.7; transform: scale(1.1); }
.nav-item.active { opacity: 1; }
.nav-item.active::before { content: ''; position: absolute; left: -12px; width: 2px; height: 20px; background: var(--frost); border-radius: 1px; box-shadow: 0 0 8px var(--aurora); }
.nav-item svg { width: 18px; height: 18px; fill: currentColor; }
.nav-item .tooltip { position: absolute; left: calc(100% + 14px); top: 50%; transform: translateY(-50%) translateX(-4px); background: rgba(14,16,25,0.95); border: 1px solid rgba(163,172,208,0.12); backdrop-filter: blur(12px); color: var(--mist); font-size: 11px; letter-spacing: 0.08em; padding: 6px 12px; white-space: nowrap; opacity: 0; pointer-events: none; transition: all 0.3s var(--ease-out); }
.nav-item:hover .tooltip { opacity: 1; transform: translateY(-50%) translateX(0); }

/* Main Content */
.main-content { position: relative; margin-left: var(--nav-width); height: calc(100vh - var(--player-height)); overflow-y: auto; overflow-x: hidden; z-index: 10; scroll-behavior: smooth; }
.main-content::-webkit-scrollbar { width: 2px; }
.main-content::-webkit-scrollbar-track { background: transparent; }
.main-content::-webkit-scrollbar-thumb { background: rgba(163,172,208,0.15); border-radius: 1px; }
.page-section { display: none; min-height: 100%; padding: 60px 80px; animation: fadeIn 0.6s var(--ease-out); }
.page-section.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* Home */
.home-section { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; min-height: 100%; }
.home-title { font-family: var(--font-display); font-size: clamp(48px,8vw,96px); font-weight: var(--weight-light); font-style: italic; color: var(--snow); letter-spacing: -0.03em; line-height: 1; margin-bottom: 20px; opacity: 0; animation: titleReveal 1.2s var(--ease-out) 0.3s forwards; }
@keyframes titleReveal { from { opacity: 0; transform: translateY(20px) scale(0.98); letter-spacing: 0.1em; } to { opacity: 1; transform: translateY(0) scale(1); letter-spacing: -0.03em; } }
.home-subtitle { font-size: 13px; color: var(--frost); letter-spacing: 0.3em; text-transform: uppercase; opacity: 0; animation: subtitleReveal 1s var(--ease-out) 0.8s forwards; }
@keyframes subtitleReveal { from { opacity: 0; transform: translateY(10px); } to { opacity: 0.5; transform: translateY(0); } }
.home-line-divider { width: 60px; height: 1px; background: linear-gradient(90deg, transparent, var(--frost), transparent); margin: 28px auto; opacity: 0; animation: lineReveal 1.2s var(--ease-out) 1.1s forwards; }
@keyframes lineReveal { from { opacity: 0; width: 0; } to { opacity: 0.3; width: 60px; } }
.home-desc { font-size: 13px; color: var(--silver); letter-spacing: 0.05em; line-height: 1.8; max-width: 360px; opacity: 0; animation: subtitleReveal 1s var(--ease-out) 1.4s forwards; }

/* Section Header */
.section-header { margin-bottom: 48px; padding-bottom: 24px; border-bottom: 1px solid var(--line-art); display: flex; justify-content: space-between; align-items: flex-end; }
.section-header-left {}
.section-title { font-family: var(--font-display); font-size: 36px; font-weight: var(--weight-light); font-style: italic; color: var(--snow); letter-spacing: -0.02em; margin-bottom: 8px; }
.section-subtitle { font-size: 11px; color: var(--silver); letter-spacing: 0.25em; text-transform: uppercase; }

/* Admin: Add Button */
.admin-add-btn { display: none; background: none; border: 1px solid rgba(163,172,208,0.15); color: var(--frost); font-size: 11px; letter-spacing: 0.1em; padding: 8px 16px; cursor: pointer; transition: all 0.3s; font-family: var(--font-body); }
.admin-add-btn:hover { border-color: var(--aurora); color: var(--aurora); }
body.is-admin .admin-add-btn { display: inline-flex; align-items: center; gap: 6px; }

/* Board Grid */
.board-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.board-card { background: rgba(14,16,25,0.6); border: 1px solid rgba(163,172,208,0.06); backdrop-filter: blur(8px); padding: 24px; cursor: pointer; transition: all 0.4s var(--ease-out); position: relative; overflow: hidden; }
.board-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 1px; background: linear-gradient(90deg, transparent, var(--frost), transparent); opacity: 0; transition: opacity 0.4s; }
.board-card:hover { border-color: rgba(163,172,208,0.15); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
.board-card:hover::before { opacity: 0.4; }
.card-date { font-size: 10px; color: var(--silver); letter-spacing: 0.15em; margin-bottom: 12px; }
.card-title { font-family: var(--font-display); font-size: 20px; font-weight: var(--weight-regular); color: var(--mist); margin-bottom: 8px; line-height: 1.3; }
.card-excerpt { font-size: 12.5px; color: var(--silver); line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card-tag { display: inline-block; font-size: 10px; color: var(--frost); border: 1px solid rgba(163,172,208,0.12); padding: 3px 8px; margin-top: 12px; margin-right: 4px; letter-spacing: 0.08em; }

/* Admin card controls */
.card-admin-controls { display: none; position: absolute; top: 12px; right: 12px; gap: 6px; }
body.is-admin .card-admin-controls { display: flex; }
.card-ctrl-btn { background: rgba(14,16,25,0.8); border: 1px solid rgba(163,172,208,0.1); color: var(--silver); width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; font-size: 12px; }
.card-ctrl-btn:hover { color: var(--mist); border-color: var(--frost); }
.card-ctrl-btn.delete:hover { color: var(--danger); border-color: var(--danger); }

/* Prompt Cards */
.prompt-card { background: rgba(14,16,25,0.6); border: 1px solid rgba(163,172,208,0.06); padding: 20px; position: relative; transition: all 0.4s var(--ease-out); }
.prompt-card:hover { border-color: rgba(163,172,208,0.15); }
.prompt-text { font-family: 'Pretendard', monospace; font-size: 12px; color: var(--frost); line-height: 1.7; letter-spacing: 0.01em; white-space: pre-wrap; word-break: break-all; }
.prompt-copy-btn { position: absolute; top: 12px; right: 12px; background: rgba(163,172,208,0.08); border: 1px solid rgba(163,172,208,0.1); color: var(--frost); font-size: 10px; letter-spacing: 0.1em; padding: 5px 10px; cursor: pointer; transition: all 0.3s; font-family: var(--font-body); }
.prompt-copy-btn:hover { background: rgba(163,172,208,0.15); color: var(--snow); }
.prompt-copy-btn.copied { color: var(--aurora); border-color: var(--aurora); }

/* Image Grid */
.image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.image-grid-item { aspect-ratio: 1; background: var(--deep); border: 1px solid var(--line-art); overflow: hidden; position: relative; cursor: pointer; transition: all 0.4s var(--ease-out); }
.image-grid-item:hover { border-color: rgba(163,172,208,0.2); transform: scale(1.02); }
.image-grid-item img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; transition: opacity 0.4s; }
.image-grid-item:hover img { opacity: 1; }
.image-admin-controls { display: none; position: absolute; top: 8px; right: 8px; }
body.is-admin .image-admin-controls { display: flex; gap: 4px; }

/* Empty State */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; text-align: center; }
.empty-state-icon { width: 48px; height: 48px; margin-bottom: 20px; opacity: 0.15; }
.empty-state-text { font-size: 13px; color: var(--silver); letter-spacing: 0.05em; }

/* ══ Modal System ══ */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(8,9,15,0.85); backdrop-filter: blur(8px); z-index: 500; justify-content: center; align-items: center; animation: fadeIn 0.3s var(--ease-out); }
.modal-overlay.active { display: flex; }
.modal-box { background: var(--deep); border: 1px solid rgba(163,172,208,0.1); width: 90%; max-width: 600px; max-height: 85vh; overflow-y: auto; padding: 40px; position: relative; }
.modal-box::-webkit-scrollbar { width: 2px; }
.modal-box::-webkit-scrollbar-thumb { background: rgba(163,172,208,0.15); }
.modal-close { position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--silver); font-size: 20px; cursor: pointer; transition: color 0.3s; padding: 4px 8px; }
.modal-close:hover { color: var(--mist); }
.modal-title { font-family: var(--font-display); font-size: 24px; font-weight: var(--weight-light); font-style: italic; color: var(--snow); margin-bottom: 28px; }

/* Form Elements */
.form-group { margin-bottom: 20px; }
.form-label { display: block; font-size: 11px; color: var(--silver); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 8px; }
.form-input, .form-textarea, .form-select {
  width: 100%; background: rgba(8,9,15,0.6); border: 1px solid rgba(163,172,208,0.1);
  color: var(--mist); font-family: var(--font-body); font-size: 13px; padding: 12px 16px;
  transition: border-color 0.3s; outline: none; font-weight: var(--weight-light);
}
.form-input:focus, .form-textarea:focus { border-color: var(--frost); }
.form-textarea { min-height: 120px; resize: vertical; line-height: 1.7; }
.form-input-file { display: none; }
.form-file-label { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border: 1px dashed rgba(163,172,208,0.15); color: var(--silver); font-size: 12px; cursor: pointer; transition: all 0.3s; }
.form-file-label:hover { border-color: var(--frost); color: var(--frost); }
.form-file-preview { margin-top: 10px; max-width: 200px; max-height: 150px; object-fit: cover; border: 1px solid var(--line-art); }
.form-actions { display: flex; gap: 12px; margin-top: 28px; }
.btn-primary { background: rgba(163,172,208,0.1); border: 1px solid var(--frost); color: var(--frost); font-size: 12px; letter-spacing: 0.1em; padding: 10px 24px; cursor: pointer; transition: all 0.3s; font-family: var(--font-body); }
.btn-primary:hover { background: rgba(163,172,208,0.2); color: var(--snow); }
.btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-secondary { background: none; border: 1px solid rgba(163,172,208,0.1); color: var(--silver); font-size: 12px; letter-spacing: 0.1em; padding: 10px 24px; cursor: pointer; transition: all 0.3s; font-family: var(--font-body); }
.btn-secondary:hover { color: var(--mist); border-color: rgba(163,172,208,0.2); }
.btn-danger { background: none; border: 1px solid rgba(196,112,112,0.3); color: var(--danger); font-size: 12px; letter-spacing: 0.1em; padding: 10px 24px; cursor: pointer; transition: all 0.3s; font-family: var(--font-body); }
.btn-danger:hover { background: rgba(196,112,112,0.1); }

/* Detail View */
.detail-view { display: none; min-height: 100%; padding: 60px 80px; animation: fadeIn 0.6s var(--ease-out); }
.detail-view.active { display: block; }
.detail-back { background: none; border: none; color: var(--silver); font-size: 12px; letter-spacing: 0.1em; cursor: pointer; margin-bottom: 32px; transition: color 0.3s; font-family: var(--font-body); display: inline-flex; align-items: center; gap: 6px; }
.detail-back:hover { color: var(--frost); }
.detail-title { font-family: var(--font-display); font-size: 32px; font-weight: var(--weight-light); font-style: italic; color: var(--snow); margin-bottom: 12px; }
.detail-date { font-size: 11px; color: var(--silver); letter-spacing: 0.15em; margin-bottom: 40px; }
.detail-content { font-size: 14px; color: var(--mist); line-height: 2; white-space: pre-wrap; }

/* Login Modal */
.login-trigger { position: fixed; bottom: calc(var(--player-height) + 12px); right: 12px; background: none; border: none; color: var(--silver); opacity: 0.15; font-size: 10px; cursor: pointer; z-index: 90; transition: opacity 0.3s; padding: 4px; }
.login-trigger:hover { opacity: 0.5; }
body.is-admin .login-trigger { opacity: 0.6; color: var(--aurora); }

/* Admin indicator */
.admin-badge { display: none; position: fixed; top: 12px; right: 12px; background: rgba(143,184,203,0.1); border: 1px solid rgba(143,184,203,0.2); color: var(--aurora); font-size: 10px; letter-spacing: 0.15em; padding: 5px 12px; z-index: 100; }
body.is-admin .admin-badge { display: block; }

/* Music Player */
.music-player { position: fixed; bottom: 0; left: 0; right: 0; height: var(--player-height); background: rgba(8,9,15,0.92); backdrop-filter: blur(20px); border-top: 1px solid var(--line-art); display: flex; align-items: center; padding: 0 24px 0 calc(var(--nav-width) + 24px); gap: 20px; z-index: 200; }
.player-album-art { width: 44px; height: 44px; border-radius: 50%; background: var(--deep); border: 1px solid rgba(163,172,208,0.08); overflow: hidden; flex-shrink: 0; position: relative; }
.player-album-art.spinning { animation: lp-spin 8s linear infinite; }
@keyframes lp-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.player-album-img { width: 100%; height: 100%; object-fit: cover; }
.player-album-art::after { content: ''; position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: var(--void); border-radius: 50%; transform: translate(-50%,-50%); border: 1px solid rgba(163,172,208,0.1); }
.player-info { flex: 0 0 180px; min-width: 0; }
.player-track-name { font-size: 12.5px; color: var(--mist); font-weight: var(--weight-regular); letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-playlist-name { font-size: 10px; color: var(--silver); letter-spacing: 0.08em; margin-top: 2px; }
.player-controls { display: flex; align-items: center; gap: 18px; }
.player-btn { background: none; border: none; cursor: pointer; color: var(--frost); opacity: 0.4; transition: all 0.3s; display: flex; align-items: center; justify-content: center; padding: 0; }
.player-btn:hover { opacity: 0.9; transform: scale(1.1); }
.player-btn svg { width: 16px; height: 16px; fill: currentColor; }
.player-btn.play-btn svg { width: 22px; height: 22px; }
.player-btn.active { opacity: 1; color: var(--aurora); }
.player-progress-area { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
.player-time { font-size: 10px; color: var(--silver); letter-spacing: 0.05em; font-variant-numeric: tabular-nums; flex-shrink: 0; width: 36px; text-align: center; }
.player-progress-bar { flex: 1; height: 20px; display: flex; align-items: center; cursor: pointer; position: relative; }
.player-progress-track { width: 100%; height: 1.5px; background: rgba(163,172,208,0.1); position: relative; pointer-events: none; }
.player-progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--frost), var(--aurora)); position: relative; transition: width 0.25s linear; box-shadow: 0 0 6px rgba(143,184,203,0.3); }
.player-progress-fill::after { content: ''; position: absolute; right: -3px; top: 50%; width: 6px; height: 6px; background: var(--aurora); transform: translateY(-50%) rotate(45deg); box-shadow: 0 0 8px var(--aurora); opacity: 0; transition: opacity 0.3s; }
.player-progress-bar:hover .player-progress-fill::after { opacity: 1; }
.player-volume { display: flex; align-items: center; gap: 8px; opacity: 0.4; transition: opacity 0.3s; }
.player-volume:hover { opacity: 1; }
.player-volume svg { width: 14px; height: 14px; fill: var(--frost); flex-shrink: 0; }
.player-volume input[type="range"] { -webkit-appearance: none; width: 60px; height: 1.5px; background: rgba(163,172,208,0.15); outline: none; cursor: pointer; }
.player-volume input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 6px; height: 6px; background: var(--frost); transform: rotate(45deg); cursor: pointer; }

/* Toast */
.toast-container { position: fixed; bottom: calc(var(--player-height) + 16px); left: 50%; transform: translateX(-50%); z-index: 999; }
.toast-msg { background: rgba(14,16,25,0.92); backdrop-filter: blur(12px); border: 1px solid rgba(163,172,208,0.12); color: var(--mist); font-size: 11px; letter-spacing: 0.1em; padding: 10px 20px; opacity: 0; transform: translateY(8px); transition: all 0.4s var(--ease-out); pointer-events: none; }
.toast-msg.show { opacity: 1; transform: translateY(0); }

/* Loading Spinner */
.spinner { display: inline-block; width: 16px; height: 16px; border: 1.5px solid rgba(163,172,208,0.2); border-top-color: var(--frost); border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Responsive */
@media (max-width: 768px) {
  :root { --nav-width: 0px; }
  .nav-dock { display: none; }
  .page-section, .detail-view { padding: 40px 24px; }
  .music-player { padding: 0 16px; }
  .player-info { flex: 0 0 120px; }
  .player-volume { display: none; }
  .board-grid { grid-template-columns: 1fr; }
  .image-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .modal-box { padding: 28px 20px; }
  .mobile-nav { display: flex !important; position: fixed; bottom: var(--player-height); left: 0; right: 0; height: 52px; background: rgba(8,9,15,0.95); border-top: 1px solid var(--line-art); z-index: 150; align-items: center; justify-content: space-around; }
  .main-content { height: calc(100vh - var(--player-height) - 52px); margin-left: 0; }
}
.mobile-nav { display: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  #particle-canvas { display: none; }
}
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>
<div class="line-art-overlay">
  <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="line-fade" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="rgba(163,172,208,0.04)"/><stop offset="100%" stop-color="rgba(143,184,203,0.02)"/></linearGradient></defs>
    <g stroke="url(#line-fade)" stroke-width="0.5" fill="none">
      <polyline points="120,80 280,140 350,60 520,120 480,200"/>
      <polyline points="1400,100 1520,60 1600,130 1750,90"/>
      <circle cx="280" cy="140" r="2" fill="rgba(163,172,208,0.06)"/>
      <circle cx="520" cy="120" r="1.5" fill="rgba(163,172,208,0.05)"/>
      <circle cx="1520" cy="60" r="2" fill="rgba(163,172,208,0.06)"/>
      <path d="M0,950 Q200,920 400,940 T800,930 T1200,945 T1600,925 T1920,940" opacity="0.5"/>

<script>
/* ══════════════════════════════════════
   palely.me — Application Core
   ══════════════════════════════════════ */

// ── Supabase Clients ──
const PALELY_URL = 'https://lwudusogucvuiwglulzh.supabase.co';
const PALELY_KEY = 'sb_publishable_CEJvz8BuMNn2XO34mvR4Jw_4PduWouH';
const PMB_URL = 'https://zrfasztpsmprfpslizac.supabase.co';
const PMB_KEY = 'sb_publishable_z7m5HVzuiUhBzRKIAuOKZQ_y4PFw-6B';

let palelyDB = null;
let pmbClient = null;
let currentUser = null;
let isAdmin = false;

// ── State ──
let currentEditorType = null;
let currentEditId = null;
let currentDetailType = null;
let previousPage = 'home';

// ── Init ──
window.addEventListener('DOMContentLoaded', async () => {
  try {
    palelyDB = window.supabase.createClient(PALELY_URL, PALELY_KEY);
    pmbClient = window.supabase.createClient(PMB_URL, PMB_KEY);
  } catch(e) { console.error('Supabase init:', e); }

  // Check auth session
  await checkAuth();

  // Load boards
  await loadBoards();

  // Hash routing
  const hash = window.location.hash.slice(1);
  if (hash) navigate(hash);
});

// ══════════════════════════════════════
// AUTH
// ══════════════════════════════════════
async function checkAuth() {
  if (!palelyDB) return;
  try {
    const { data: { user } } = await palelyDB.auth.getUser();
    if (user) {
      currentUser = user;
      isAdmin = true;
      document.body.classList.add('is-admin');
    }
  } catch(e) {}
}

function toggleLoginModal() {
  const m = document.getElementById('login-modal');
  m.classList.toggle('active');
  document.getElementById('login-error').textContent = '';
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');

  if (!email || !pw) { errEl.textContent = 'Email and password required'; return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

  try {
    const { data, error } = await palelyDB.auth.signInWithPassword({ email, password: pw });
    if (error) throw error;
    currentUser = data.user;
    isAdmin = true;
    document.body.classList.add('is-admin');
    closeModal('login-modal');
    showToast('Admin logged in');
    await loadBoards();
  } catch(e) {
    errEl.textContent = e.message || 'Login failed';
  }
  btn.disabled = false; btn.textContent = 'LOGIN';
}

async function doLogout() {
  if (!palelyDB) return;
  await palelyDB.auth.signOut();
  currentUser = null;
  isAdmin = false;
  document.body.classList.remove('is-admin');
  closeModal('login-modal');
  showToast('Logged out');
}

// ══════════════════════════════════════
// SPA ROUTER
// ══════════════════════════════════════
function navigate(page) {
  // Hide detail view
  document.getElementById('detail-view').classList.remove('active');
  document.getElementById('detail-view').style.display = 'none';

  document.querySelectorAll('.page-section').forEach(s => { s.classList.remove('active'); s.style.display = ''; });
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

  const target = document.getElementById('page-' + page);
  if (target) {
    target.classList.add('active');
    target.style.animation = 'none'; target.offsetHeight; target.style.animation = '';
  }
  document.querySelectorAll(`.nav-item[data-page="${page}"]`).forEach(n => n.classList.add('active'));
  document.getElementById('main-content').scrollTop = 0;
  window.location.hash = page;
  previousPage = page;
}
window.addEventListener('hashchange', () => { const p = window.location.hash.slice(1) || 'home'; navigate(p); });

// ══════════════════════════════════════
// TOAST
// ══════════════════════════════════════
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ══════════════════════════════════════
// IMAGE PROTECTION
// ══════════════════════════════════════
document.addEventListener('contextmenu', (e) => {
  if (e.target.tagName === 'IMG' && !isAdmin) {
    e.preventDefault();
    showToast('이미지 저장이 제한됩니다');
  }
});

// ══════════════════════════════════════
// BOARD DATA LOADING
// ══════════════════════════════════════
async function loadBoards() {
  if (!palelyDB) return;
  await Promise.all([loadDiary(), loadAssets(), loadBanners(), loadLogs(), loadPrompts()]);
}

async function loadDiary() {
  const { data } = await palelyDB.from('diary').select('*').order('created_at', { ascending: false });
  const grid = document.getElementById('diary-grid');
  if (!data || data.length === 0) { grid.innerHTML = emptyHtml('diary'); return; }
  grid.innerHTML = data.map(d => `
    <div class="board-card" onclick="openDetail('diary','${d.id}')">
      <div class="card-admin-controls">
        <button class="card-ctrl-btn" onclick="event.stopPropagation();openEditor('diary','${d.id}')">✎</button>
        <button class="card-ctrl-btn delete" onclick="event.stopPropagation();confirmDelete('diary','${d.id}')">✕</button>
      </div>
      <div class="card-date">${fmtDate(d.created_at)}</div>
      <div class="card-title">${esc(d.title)}</div>
      <div class="card-excerpt">${esc(d.content||'')}</div>
    </div>`).join('');
}

async function loadAssets() {
  const { data } = await palelyDB.from('assets').select('*').order('created_at', { ascending: false });
  const grid = document.getElementById('assets-grid');
  if (!data || data.length === 0) { grid.innerHTML = emptyHtml('assets'); return; }
  grid.innerHTML = data.map(a => `
    <div class="image-grid-item" onclick="viewImage('${esc(a.image_url)}')">
      <div class="image-admin-controls">
        <button class="card-ctrl-btn delete" onclick="event.stopPropagation();confirmDelete('assets','${a.id}')">✕</button>
      </div>
      <img src="${esc(a.image_url)}" alt="${esc(a.title||'')}" draggable="false">
    </div>`).join('');
}

async function loadBanners() {
  const { data } = await palelyDB.from('banners').select('*').order('created_at', { ascending: false });
  const grid = document.getElementById('banners-grid');
  if (!data || data.length === 0) { grid.innerHTML = emptyHtml('banners'); return; }
  grid.innerHTML = data.map(b => `
    <div class="image-grid-item" onclick="viewImage('${esc(b.image_url)}')">
      <div class="image-admin-controls">
        <button class="card-ctrl-btn delete" onclick="event.stopPropagation();confirmDelete('banners','${b.id}')">✕</button>
      </div>
      <img src="${esc(b.image_url)}" alt="${esc(b.title||'')}" draggable="false">
    </div>`).join('');
}

async function loadLogs() {
  const { data } = await palelyDB.from('logs').select('*').order('created_at', { ascending: false });
  const grid = document.getElementById('logs-grid');
  if (!data || data.length === 0) { grid.innerHTML = emptyHtml('logs'); return; }
  grid.innerHTML = data.map(l => `
    <div class="board-card" onclick="openDetail('logs','${l.id}')">
      <div class="card-admin-controls">
        <button class="card-ctrl-btn" onclick="event.stopPropagation();openEditor('logs','${l.id}')">✎</button>
        <button class="card-ctrl-btn delete" onclick="event.stopPropagation();confirmDelete('logs','${l.id}')">✕</button>
      </div>
      <div class="card-date">${fmtDate(l.created_at)}${l.source?' · '+esc(l.source):''}</div>
      <div class="card-title">${esc(l.title)}</div>
      <div class="card-excerpt">${esc(l.content||'')}</div>
    </div>`).join('');
}

async function loadPrompts() {
  const { data } = await palelyDB.from('prompts').select('*').order('created_at', { ascending: false });
  const grid = document.getElementById('prompts-grid');
  if (!data || data.length === 0) { grid.innerHTML = emptyHtml('prompts'); return; }
  grid.innerHTML = data.map(p => `
    <div class="prompt-card">
      <div class="card-admin-controls">
        <button class="card-ctrl-btn" onclick="openEditor('prompts','${p.id}')">✎</button>
        <button class="card-ctrl-btn delete" onclick="confirmDelete('prompts','${p.id}')">✕</button>
      </div>
      ${p.title?'<div class="card-date">'+esc(p.title)+(p.category?' · '+esc(p.category):'')+'</div>':''}
      <div class="prompt-text">${esc(p.prompt_text)}</div>
      <button class="prompt-copy-btn" onclick="copyPrompt(this,'${btoa(encodeURIComponent(p.prompt_text))}')">COPY</button>
      ${p.tags&&p.tags.length?p.tags.map(t=>'<span class="card-tag">'+esc(t)+'</span>').join(''):''}
    </div>`).join('');
}

// ══════════════════════════════════════
// DETAIL VIEW
// ══════════════════════════════════════
async function openDetail(type, id) {
  if (!palelyDB) return;
  const { data } = await palelyDB.from(type).select('*').eq('id', id).single();
  if (!data) return;

  currentDetailType = type;
  // Hide all page sections
  document.querySelectorAll('.page-section').forEach(s => s.style.display = 'none');

  const dv = document.getElementById('detail-view');
  dv.style.display = 'block';
  dv.classList.add('active');

  document.getElementById('detail-title').textContent = data.title || '';
  document.getElementById('detail-date').textContent = fmtDate(data.created_at) + (data.source ? ' · ' + data.source : '');
  document.getElementById('detail-content').textContent = data.content || data.prompt_text || '';

  // Admin actions
  const adminActions = document.getElementById('detail-admin-actions');
  if (isAdmin) {
    adminActions.innerHTML = `
      <button class="btn-secondary" onclick="openEditor('${type}','${id}')">EDIT</button>
      <button class="btn-danger" style="margin-left:8px;" onclick="confirmDelete('${type}','${id}')">DELETE</button>`;
  } else { adminActions.innerHTML = ''; }

  document.getElementById('main-content').scrollTop = 0;
}

function closeDetail() {
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('detail-view').classList.remove('active');
  navigate(previousPage);
}

// ══════════════════════════════════════
// EDITOR (CREATE / EDIT)
// ══════════════════════════════════════
async function openEditor(type, editId) {
  currentEditorType = type;
  currentEditId = editId || null;

  const titleEl = document.getElementById('editor-title');
  const fieldsEl = document.getElementById('editor-fields');
  const delBtn = document.getElementById('editor-delete-btn');

  delBtn.style.display = editId ? 'inline-block' : 'none';
  let existingData = null;

  if (editId) {
    const { data } = await palelyDB.from(type).select('*').eq('id', editId).single();
    existingData = data;
  }

  const fields = getFieldsForType(type);
  titleEl.textContent = (editId ? 'Edit' : 'New') + ' ' + typeLabel(type);

  fieldsEl.innerHTML = fields.map(f => {
    const val = existingData ? (existingData[f.key] || '') : '';
    if (f.type === 'textarea') {
      return `<div class="form-group"><label class="form-label">${f.label}</label><textarea class="form-textarea" id="ef-${f.key}" placeholder="${f.placeholder||''}">${esc(Array.isArray(val)?val.join(', '):val)}</textarea></div>`;
    } else if (f.type === 'file') {
      return `<div class="form-group"><label class="form-label">${f.label}</label>
        <label class="form-file-label"><span>📎 파일 선택</span><input type="file" class="form-input-file" id="ef-${f.key}" accept="image/*" onchange="previewFile(this)"></label>
        ${existingData && existingData[f.key] ? '<img class="form-file-preview" id="ef-preview" src="'+esc(existingData[f.key])+'">' : '<img class="form-file-preview" id="ef-preview" style="display:none;">'}</div>`;
    } else {
      return `<div class="form-group"><label class="form-label">${f.label}</label><input type="text" class="form-input" id="ef-${f.key}" value="${esc(Array.isArray(val)?val.join(', '):val)}" placeholder="${f.placeholder||''}"></div>`;
    }
  }).join('');

  document.getElementById('editor-modal').classList.add('active');
}

function getFieldsForType(type) {
  switch(type) {
    case 'diary': return [
      { key: 'title', label: 'Title', type: 'text', placeholder: '제목' },
      { key: 'content', label: 'Content', type: 'textarea', placeholder: '내용을 입력하세요...' }
    ];
    case 'assets': return [
      { key: 'title', label: 'Title', type: 'text', placeholder: '에셋 이름 (선택)' },
      { key: 'image_url', label: 'Image', type: 'file' },
      { key: 'tags', label: 'Tags', type: 'text', placeholder: '태그1, 태그2, ...' }
    ];
    case 'banners': return [
      { key: 'title', label: 'Title', type: 'text', placeholder: '배너 이름 (선택)' },
      { key: 'image_url', label: 'Image', type: 'file' }
    ];
    case 'logs': return [
      { key: 'title', label: 'Title', type: 'text', placeholder: '제목' },
      { key: 'source', label: 'Source', type: 'text', placeholder: '출처 (선택)' },
      { key: 'content', label: 'Content', type: 'textarea', placeholder: '로그 내용...' }
    ];
    case 'prompts': return [
      { key: 'title', label: 'Title', type: 'text', placeholder: '프롬프트 이름 (선택)' },
      { key: 'category', label: 'Category', type: 'text', placeholder: '카테고리 (선택)' },
      { key: 'prompt_text', label: 'Prompt', type: 'textarea', placeholder: '프롬프트 텍스트...' },
      { key: 'tags', label: 'Tags', type: 'text', placeholder: '태그1, 태그2, ...' }
    ];
    default: return [];
  }
}

function previewFile(input) {
  const preview = document.getElementById('ef-preview');
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = (e) => { preview.src = e.target.result; preview.style.display = 'block'; };
    reader.readAsDataURL(input.files[0]);
  }
}

async function saveEntry() {
  if (!palelyDB || !isAdmin) { showToast('Admin login required'); return; }

  const btn = document.getElementById('editor-save-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

  try {
    const fields = getFieldsForType(currentEditorType);
    const record = {};

    for (const f of fields) {
      if (f.type === 'file') {
        const fileInput = document.getElementById('ef-' + f.key);
        if (fileInput.files && fileInput.files[0]) {
          // Upload to Supabase Storage
          const file = fileInput.files[0];
          const ext = file.name.split('.').pop();
          const fileName = `${currentEditorType}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;

          const { data: uploadData, error: uploadError } = await palelyDB.storage
            .from('images')
            .upload(fileName, file, { contentType: file.type, upsert: false });

          if (uploadError) throw uploadError;

          const { data: urlData } = palelyDB.storage.from('images').getPublicUrl(fileName);
          record[f.key] = urlData.publicUrl;
        } else if (currentEditId) {
          // Keep existing URL if no new file
          continue;
        }
      } else {
        let val = document.getElementById('ef-' + f.key)?.value?.trim() || '';
        if (f.key === 'tags') {
          record[f.key] = val ? val.split(',').map(t => t.trim()).filter(Boolean) : [];
        } else {
          record[f.key] = val;
        }
      }
    }

    if (currentEditId) {
      record.updated_at = new Date().toISOString();
      const { error } = await palelyDB.from(currentEditorType).update(record).eq('id', currentEditId);
      if (error) throw error;
      showToast('Updated');
    } else {
      const { error } = await palelyDB.from(currentEditorType).insert(record);
      if (error) throw error;
      showToast('Created');
    }

    closeModal('editor-modal');
    await loadBoardByType(currentEditorType);
    // If detail view was open, refresh
    if (currentEditId && document.getElementById('detail-view').style.display === 'block') {
      await openDetail(currentEditorType, currentEditId);
    }
  } catch(e) {
    showToast('Error: ' + (e.message || 'Save failed'));
    console.error(e);
  }

  btn.disabled = false; btn.textContent = 'SAVE';
}

async function confirmDelete(type, id) {
  if (!confirm('Delete this entry?')) return;
  await deleteEntryDirect(type, id);
}

async function deleteEntry() {
  if (!currentEditId || !confirm('Delete this entry?')) return;
  await deleteEntryDirect(currentEditorType, currentEditId);
  closeModal('editor-modal');
}

async function deleteEntryDirect(type, id) {
  if (!palelyDB || !isAdmin) return;
  try {
    const { error } = await palelyDB.from(type).delete().eq('id', id);
    if (error) throw error;
    showToast('Deleted');
    await loadBoardByType(type);
    // Close detail if open
    if (document.getElementById('detail-view').style.display === 'block') {
      closeDetail();
    }
  } catch(e) { showToast('Delete failed: ' + e.message); }
}

async function loadBoardByType(type) {
  switch(type) {
    case 'diary': await loadDiary(); break;
    case 'assets': await loadAssets(); break;
    case 'banners': await loadBanners(); break;
    case 'logs': await loadLogs(); break;
    case 'prompts': await loadPrompts(); break;
  }
}

// ══════════════════════════════════════
// PROMPT COPY
// ══════════════════════════════════════
function copyPrompt(btn, encoded) {
  const text = decodeURIComponent(atob(encoded));
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'COPIED';
    btn.classList.add('copied');
    showToast('클립보드에 복사됨');
    setTimeout(() => { btn.textContent = 'COPY'; btn.classList.remove('copied'); }, 1500);
  });
}

function esc(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
function fmtDate(d) { return new Date(d).toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' }); }
function typeLabel(t) { return { diary:'Diary', assets:'Asset', banners:'Banner', logs:'Log', prompts:'Prompt' }[t] || t; }
function emptyHtml(type) {
  const icons = { diary: 'M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z', assets: 'M21 19V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z', banners: 'M4 6H2v14a2 2 0 002 2h14v-2H4V6z', logs: 'M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z', prompts: 'M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0L19.2 12l-4.6-4.6L16 6l6 6-6 6-1.4-1.4z' };
  const labels = { diary:'기록이', assets:'에셋이', banners:'배너가', logs:'로그가', prompts:'프롬프트가' };
  const isImg = type === 'assets' || type === 'banners';

// ══════════════════════════════════════
// PARTICLE SYSTEM
// ══════════════════════════════════════
(function() {
  const canvas = document.getElementById('particle-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [], W, H;
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);

  function mkStar() { return { type:'star', x:Math.random()*W, y:Math.random()*H, size:Math.random()*1.5+0.5, alpha:Math.random()*0.4, alphaTarget:Math.random()*0.6+0.1, speed:Math.random()*0.005+0.002, phase:Math.random()*Math.PI*2 }; }
  function mkSnow() { return { type:'snow', x:Math.random()*W, y:Math.random()*H, size:Math.random()*2+0.5, alpha:Math.random()*0.25+0.05, speedY:Math.random()*0.3+0.1, speedX:Math.random()*0.2-0.1, wobble:Math.random()*Math.PI*2, wobbleSpeed:Math.random()*0.01+0.005 }; }
  for (let i=0;i<120;i++) particles.push(mkStar());
  for (let i=0;i<40;i++) particles.push(mkSnow());

  function animate() {
    ctx.clearRect(0,0,W,H);
    particles.forEach(p => {
      if (p.type==='star') {
        p.phase+=p.speed; p.alpha+=(p.alphaTarget-p.alpha)*0.01;
        if (Math.random()<0.002) p.alphaTarget=Math.random()*0.6+0.1;
        ctx.globalAlpha=p.alpha*(Math.sin(p.phase)*0.5+0.5);
        ctx.fillStyle='#c8d0e8'; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
      } else {
        p.wobble+=p.wobbleSpeed; p.x+=p.speedX+Math.sin(p.wobble)*0.15; p.y+=p.speedY;
        if(p.y>H+10){p.y=-10;p.x=Math.random()*W;} if(p.x<-10)p.x=W+10; if(p.x>W+10)p.x=-10;
        ctx.globalAlpha=p.alpha; ctx.fillStyle='#e4e7f1'; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
      }
    });
    ctx.globalAlpha=1; requestAnimationFrame(animate);
  }
  animate();
})();

// ══════════════════════════════════════
// MUSIC PLAYER (PMB)
// ══════════════════════════════════════
let ytPlayer=null, pmbTracks=[], pmbCurrentIdx=-1, pmbIsPlaying=false, pmbIsShuffling=false, pmbPlayedSet={}, pmbProgressInterval=null;

function loadYTAPI() { const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s); }
loadYTAPI();

window.onYouTubeIframeAPIReady = function() {
  ytPlayer = new YT.Player('yt-player-container', {
    height:'0', width:'0', playerVars:{playsinline:1},
    events: {
      onReady: function() {
        const v=document.getElementById('player-volume-slider');
        if(v&&ytPlayer) ytPlayer.setVolume(parseInt(v.value));
        initPMB();
      },
      onStateChange: onYTState
    }
  });
};

function onYTState(e) {
  const art=document.getElementById('player-art'), iP=document.getElementById('p-icon-play'), iPa=document.getElementById('p-icon-pause');
  if(e.data===YT.PlayerState.PLAYING) { pmbIsPlaying=true; art.classList.add('spinning'); iP.style.display='none'; iPa.style.display='block'; startProgress(); }
  else { pmbIsPlaying=false; art.classList.remove('spinning'); iP.style.display='block'; iPa.style.display='none'; clearInterval(pmbProgressInterval); }
  if(e.data===YT.PlayerState.ENDED) playerNext();
}

function startProgress() {
  clearInterval(pmbProgressInterval);
  pmbProgressInterval=setInterval(()=>{
    if(ytPlayer&&pmbIsPlaying&&ytPlayer.getCurrentTime){try{
      const c=ytPlayer.getCurrentTime(),d=ytPlayer.getDuration();
      if(d>0){document.getElementById('player-progress-fill').style.width=(c/d*100)+'%';document.getElementById('player-time-cur').textContent=fmtTime(c);document.getElementById('player-time-dur').textContent=fmtTime(d);}
    }catch(e){}}
  },250);
}
function fmtTime(s){if(!s)return'0:00';const m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+(ss<10?'0':'')+ss;}

async function initPMB() {
  if(!pmbClient) return;
  try {
    const {data:pls}=await pmbClient.from('playlists').select('*').limit(1);
    if(pls&&pls.length>0){
      const pl=pls[0];
      document.getElementById('player-playlist-name').textContent=pl.pair_name||'Pair Music Box';
      const {data:tracks}=await pmbClient.from('tracks').select('*').eq('playlist_id',pl.id).order('position');
      if(tracks&&tracks.length>0){
        pmbTracks=tracks.map(t=>({id:t.id,videoId:t.video_id,title:t.title,image:t.image_url||null}));
        pmbPlayTrack(0);
      }
    }
  }catch(e){console.log('PMB:',e);}
}

function pmbPlayTrack(idx){
  if(idx<0||idx>=pmbTracks.length)return;
  pmbCurrentIdx=idx; const t=pmbTracks[idx];
  if(ytPlayer&&ytPlayer.loadVideoById) ytPlayer.loadVideoById(t.videoId);
  document.getElementById('player-track-name').textContent=t.title;
  const img=t.image||(t.videoId?'https://img.youtube.com/vi/'+t.videoId+'/mqdefault.jpg':'');
  if(img) document.getElementById('player-art').innerHTML='<img class="player-album-img" src="'+img+'" alt="" draggable="false">';
}
function playerToggle(){if(pmbCurrentIdx===-1&&pmbTracks.length>0)pmbPlayTrack(0);else if(ytPlayer&&ytPlayer.getPlayerState)pmbIsPlaying?ytPlayer.pauseVideo():ytPlayer.playVideo();}
function playerNext(){
  if(!pmbTracks.length)return;let next;
  if(pmbIsShuffling){const a=[];for(let i=0;i<pmbTracks.length;i++){if(i!==pmbCurrentIdx&&!pmbPlayedSet[i])a.push(i);}if(a.length===0){pmbPlayedSet={};for(let i=0;i<pmbTracks.length;i++)if(i!==pmbCurrentIdx)a.push(i);}next=a[Math.floor(Math.random()*a.length)];}
  else next=(pmbCurrentIdx+1)%pmbTracks.length;
  pmbPlayedSet[next]=true;pmbPlayTrack(next);
}
function playerPrev(){if(pmbTracks.length)pmbPlayTrack((pmbCurrentIdx-1+pmbTracks.length)%pmbTracks.length);}
function playerToggleShuffle(){pmbIsShuffling=!pmbIsShuffling;pmbPlayedSet={};document.getElementById('player-shuffle-btn').classList.toggle('active',pmbIsShuffling);showToast(pmbIsShuffling?'Shuffle ON':'Shuffle OFF');}
function playerSetVolume(v){if(ytPlayer&&ytPlayer.setVolume)ytPlayer.setVolume(parseInt(v));}

// Progress seek
document.getElementById('player-progress-bar').addEventListener('mousedown',function(e){
  seekProgress(e);
  const mv=(ev)=>seekProgress(ev), up=()=>{window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up);};
  window.addEventListener('mousemove',mv); window.addEventListener('mouseup',up);
});
function seekProgress(e){const b=document.getElementById('player-progress-bar').getBoundingClientRect();let p=(e.clientX-b.left)/b.width;p=Math.max(0,Math.min(1,p));document.getElementById('player-progress-fill').style.width=(p*100)+'%';if(ytPlayer&&ytPlayer.getDuration)ytPlayer.seekTo(ytPlayer.getDuration()*p,true);}
</script>
