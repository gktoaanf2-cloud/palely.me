<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>palely.me</title>
<meta name="description" content="창백한 우주, 나의 아카이브">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--void:#08090f;--deep:#0e1019;--mist:#e4e7f1;--frost:#a3acd0;--silver:#6a7199;--aurora:#8fb8cb;--snow:#f2f4fa;--pale-glow:rgba(163,172,208,0.08);--line-art:rgba(163,172,208,0.06);--danger:#c47070;--font-display:'Cormorant Garamond',serif;--font-body:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--weight-light:300;--weight-regular:400;--weight-medium:500;--nav-width:64px;--player-height:72px;--ease-out:cubic-bezier(0.25,1,0.25,1);--ease-smooth:cubic-bezier(0.4,0,0.2,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;scroll-behavior:smooth;-webkit-user-select:none;user-select:none}
p,span,h1,h2,h3,h4,a,li,td,th,pre,code,textarea,input,label{-webkit-user-select:text;user-select:text}
body{background:var(--void);color:var(--mist);font-family:var(--font-body);font-weight:var(--weight-light);min-height:100vh;overflow:hidden;position:relative}
a{color:var(--aurora);text-decoration:none;transition:color 0.3s}a:hover{color:var(--snow)}
img:not(.admin-allow){pointer-events:none;-webkit-user-drag:none}body.is-admin img{pointer-events:auto}
#particle-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.line-art-overlay{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}.line-art-overlay svg{position:absolute;width:100%;height:100%}
.ambient-wash{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 600px 400px at 15% 20%,rgba(143,184,203,0.04) 0%,transparent 70%),radial-gradient(ellipse 500px 500px at 85% 75%,rgba(163,172,208,0.03) 0%,transparent 70%),radial-gradient(ellipse 800px 300px at 50% 100%,rgba(106,113,153,0.05) 0%,transparent 60%)}

/* Nav */
.nav-dock{position:fixed;left:0;top:0;width:var(--nav-width);height:calc(100vh - var(--player-height));display:flex;flex-direction:column;align-items:center;padding:28px 0 20px;z-index:100;border-right:1px solid var(--line-art)}
.nav-logo{font-family:var(--font-display);font-size:18px;font-weight:var(--weight-light);font-style:italic;color:var(--frost);writing-mode:vertical-rl;text-orientation:mixed;margin-bottom:40px;opacity:0.6;transition:opacity 0.4s;cursor:default}.nav-logo:hover{opacity:1}
.nav-items{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.nav-item{width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;opacity:0.3;transition:opacity 0.4s var(--ease-out),transform 0.3s var(--ease-out);border:none;background:none;color:var(--frost)}
.nav-item:hover{opacity:0.7;transform:scale(1.1)}.nav-item.active{opacity:1}
.nav-item.active::before{content:'';position:absolute;left:-12px;width:2px;height:20px;background:var(--frost);border-radius:1px;box-shadow:0 0 8px var(--aurora)}
.nav-item svg{width:18px;height:18px;fill:currentColor}
.nav-item .tooltip{position:absolute;left:calc(100% + 14px);top:50%;transform:translateY(-50%) translateX(-4px);background:rgba(14,16,25,0.95);border:1px solid rgba(163,172,208,0.12);backdrop-filter:blur(12px);color:var(--mist);font-size:11px;letter-spacing:0.08em;padding:6px 12px;white-space:nowrap;opacity:0;pointer-events:none;transition:all 0.3s var(--ease-out)}
.nav-item:hover .tooltip{opacity:1;transform:translateY(-50%) translateX(0)}

/* Main */
.main-content{position:relative;margin-left:var(--nav-width);height:calc(100vh - var(--player-height));overflow-y:auto;overflow-x:hidden;z-index:10;scroll-behavior:smooth}
.main-content::-webkit-scrollbar{width:2px}.main-content::-webkit-scrollbar-track{background:transparent}.main-content::-webkit-scrollbar-thumb{background:rgba(163,172,208,0.15);border-radius:1px}
.page-section{display:none;min-height:100%;padding:60px 80px;animation:fadeIn 0.6s var(--ease-out)}.page-section.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Home */
.home-section{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:100%}
.home-title{font-family:var(--font-display);font-size:clamp(48px,8vw,96px);font-weight:var(--weight-light);font-style:italic;color:var(--snow);letter-spacing:-0.03em;line-height:1;margin-bottom:20px;opacity:0;animation:titleReveal 1.2s var(--ease-out) 0.3s forwards}
@keyframes titleReveal{from{opacity:0;transform:translateY(20px) scale(0.98);letter-spacing:0.1em}to{opacity:1;transform:translateY(0) scale(1);letter-spacing:-0.03em}}
.home-subtitle{font-size:13px;color:var(--frost);letter-spacing:0.3em;text-transform:uppercase;opacity:0;animation:subtitleReveal 1s var(--ease-out) 0.8s forwards}
@keyframes subtitleReveal{from{opacity:0;transform:translateY(10px)}to{opacity:0.5;transform:translateY(0)}}
.home-line-divider{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--frost),transparent);margin:28px auto;opacity:0;animation:lineReveal 1.2s var(--ease-out) 1.1s forwards}
@keyframes lineReveal{from{opacity:0;width:0}to{opacity:0.3;width:60px}}
.home-desc{font-size:13px;color:var(--silver);letter-spacing:0.05em;line-height:1.8;max-width:360px;opacity:0;animation:subtitleReveal 1s var(--ease-out) 1.4s forwards}

/* Section */
.section-header{margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--line-art);display:flex;justify-content:space-between;align-items:flex-end}
.section-title{font-family:var(--font-display);font-size:36px;font-weight:var(--weight-light);font-style:italic;color:var(--snow);letter-spacing:-0.02em;margin-bottom:8px}
.section-subtitle{font-size:11px;color:var(--silver);letter-spacing:0.25em;text-transform:uppercase}
.admin-add-btn{display:none;background:none;border:1px solid rgba(163,172,208,0.15);color:var(--frost);font-size:11px;letter-spacing:0.1em;padding:8px 16px;cursor:pointer;transition:all 0.3s;font-family:var(--font-body)}
.admin-add-btn:hover{border-color:var(--aurora);color:var(--aurora)}
body.is-admin .admin-add-btn{display:inline-flex;align-items:center;gap:6px}

/* Tabs */
.tab-bar{display:flex;gap:0;margin-bottom:32px;border-bottom:1px solid var(--line-art)}
.tab-btn{background:none;border:none;border-bottom:2px solid transparent;color:var(--silver);font-size:12px;letter-spacing:0.1em;padding:10px 20px;cursor:pointer;transition:all 0.3s;font-family:var(--font-body)}
.tab-btn:hover{color:var(--frost)}.tab-btn.active{color:var(--aurora);border-bottom-color:var(--aurora)}
.tab-content{display:none;animation:fadeIn 0.4s var(--ease-out)}.tab-content.active{display:block}

/* Category Filter */
.category-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.cat-btn{background:none;border:1px solid rgba(163,172,208,0.1);color:var(--silver);font-size:11px;letter-spacing:0.08em;padding:5px 14px;cursor:pointer;transition:all 0.3s;font-family:var(--font-body)}
.cat-btn:hover{border-color:var(--frost);color:var(--frost)}.cat-btn.active{background:rgba(163,172,208,0.1);border-color:var(--frost);color:var(--mist)}

/* Cards */
.board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.board-card{background:rgba(14,16,25,0.6);border:1px solid rgba(163,172,208,0.06);backdrop-filter:blur(8px);padding:24px;cursor:pointer;transition:all 0.4s var(--ease-out);position:relative;overflow:hidden}
.board-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--frost),transparent);opacity:0;transition:opacity 0.4s}
.board-card:hover{border-color:rgba(163,172,208,0.15);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.3)}.board-card:hover::before{opacity:0.4}
.card-date{font-size:10px;color:var(--silver);letter-spacing:0.15em;margin-bottom:12px}
.card-title{font-family:var(--font-display);font-size:20px;font-weight:var(--weight-regular);color:var(--mist);margin-bottom:8px;line-height:1.3}
.card-excerpt{font-size:12.5px;color:var(--silver);line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-tag{display:inline-block;font-size:10px;color:var(--frost);border:1px solid rgba(163,172,208,0.12);padding:3px 8px;margin-top:12px;margin-right:4px;letter-spacing:0.08em}
.card-admin-controls{display:none;position:absolute;top:12px;right:12px;gap:6px}
body.is-admin .card-admin-controls{display:flex}
.card-ctrl-btn{background:rgba(14,16,25,0.8);border:1px solid rgba(163,172,208,0.1);color:var(--silver);width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s;font-size:12px}
.card-ctrl-btn:hover{color:var(--mist);border-color:var(--frost)}.card-ctrl-btn.delete:hover{color:var(--danger);border-color:var(--danger)}

/* Prompt */
.prompt-card{background:rgba(14,16,25,0.6);border:1px solid rgba(163,172,208,0.06);padding:20px;position:relative;transition:all 0.4s var(--ease-out);margin-bottom:16px}
.prompt-card:hover{border-color:rgba(163,172,208,0.15)}
.prompt-text{font-family:'Pretendard',monospace;font-size:12px;color:var(--frost);line-height:1.7;letter-spacing:0.01em;white-space:pre-wrap;word-break:break-all}
.prompt-copy-btn{position:absolute;top:12px;right:12px;background:rgba(163,172,208,0.08);border:1px solid rgba(163,172,208,0.1);color:var(--frost);font-size:10px;letter-spacing:0.1em;padding:5px 10px;cursor:pointer;transition:all 0.3s;font-family:var(--font-body)}
.prompt-copy-btn:hover{background:rgba(163,172,208,0.15);color:var(--snow)}.prompt-copy-btn.copied{color:var(--aurora);border-color:var(--aurora)}

/* Distribution Card (CaveDuck/Util) */
.dist-card{background:rgba(14,16,25,0.6);border:1px solid rgba(163,172,208,0.06);padding:24px;margin-bottom:16px;transition:all 0.4s var(--ease-out);position:relative}
.dist-card:hover{border-color:rgba(163,172,208,0.15)}
.dist-title{font-family:var(--font-display);font-size:20px;color:var(--mist);margin-bottom:8px}
.dist-desc{font-size:12.5px;color:var(--silver);line-height:1.8;margin-bottom:16px;white-space:pre-wrap}
.dist-links{display:flex;flex-wrap:wrap;gap:8px}
.dist-link-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid rgba(143,184,203,0.25);color:var(--aurora);font-size:11px;letter-spacing:0.08em;padding:8px 16px;cursor:pointer;transition:all 0.3s;font-family:var(--font-body);text-decoration:none}
.dist-link-btn:hover{background:rgba(143,184,203,0.1);color:var(--snow);border-color:var(--aurora)}
.dist-link-btn svg{width:12px;height:12px;fill:currentColor}

/* Image Grid */
.image-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.image-grid-item{aspect-ratio:1;background:var(--deep);border:1px solid var(--line-art);overflow:hidden;position:relative;cursor:pointer;transition:all 0.4s var(--ease-out)}
.image-grid-item:hover{border-color:rgba(163,172,208,0.2);transform:scale(1.02)}
.image-grid-item img{width:100%;height:100%;object-fit:cover;opacity:0.9;transition:opacity 0.4s}.image-grid-item:hover img{opacity:1}
.image-admin-controls{display:none;position:absolute;top:8px;right:8px}body.is-admin .image-admin-controls{display:flex;gap:4px}

/* Banner Grid (link-based) */
.banner-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.banner-card{background:var(--deep);border:1px solid var(--line-art);overflow:hidden;cursor:pointer;transition:all 0.4s var(--ease-out);position:relative}
.banner-card:hover{border-color:rgba(163,172,208,0.2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.banner-card img{width:100%;aspect-ratio:1.91/1;object-fit:cover;display:block;opacity:0.9;transition:opacity 0.4s}.banner-card:hover img{opacity:1}
.banner-card-info{padding:12px 16px}
.banner-card-title{font-size:12px;color:var(--mist);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner-card-url{font-size:10px;color:var(--silver);letter-spacing:0.05em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Guestbook */
.gb-form{background:rgba(14,16,25,0.6);border:1px solid rgba(163,172,208,0.06);padding:24px;margin-bottom:32px}
.gb-form-row{display:flex;gap:12px;margin-bottom:12px}
.gb-form-row .form-input{flex:1}
.gb-entry{background:rgba(14,16,25,0.4);border:1px solid rgba(163,172,208,0.04);padding:20px;margin-bottom:12px;position:relative;transition:border-color 0.3s}
.gb-entry:hover{border-color:rgba(163,172,208,0.1)}
.gb-nickname{font-size:13px;color:var(--aurora);font-weight:var(--weight-regular);margin-bottom:6px}
.gb-content{font-size:13px;color:var(--mist);line-height:1.8}
.gb-date{font-size:10px;color:var(--silver);letter-spacing:0.1em;margin-top:10px}
.gb-del{position:absolute;top:12px;right:12px;background:none;border:1px solid rgba(163,172,208,0.08);color:var(--silver);font-size:10px;padding:4px 8px;cursor:pointer;transition:all 0.3s;font-family:var(--font-body);display:none}
.gb-del:hover{color:var(--danger);border-color:var(--danger)}
body.is-admin .gb-del{display:block}

/* Empty */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center}
.empty-state-icon{width:48px;height:48px;margin-bottom:20px;opacity:0.15}
.empty-state-text{font-size:13px;color:var(--silver);letter-spacing:0.05em}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(8,9,15,0.85);backdrop-filter:blur(8px);z-index:500;justify-content:center;align-items:center;animation:fadeIn 0.3s var(--ease-out)}.modal-overlay.active{display:flex}
.modal-box{background:var(--deep);border:1px solid rgba(163,172,208,0.1);width:90%;max-width:600px;max-height:85vh;overflow-y:auto;padding:40px;position:relative}
.modal-box::-webkit-scrollbar{width:2px}.modal-box::-webkit-scrollbar-thumb{background:rgba(163,172,208,0.15)}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--silver);font-size:20px;cursor:pointer;transition:color 0.3s;padding:4px 8px}.modal-close:hover{color:var(--mist)}
.modal-title{font-family:var(--font-display);font-size:24px;font-weight:var(--weight-light);font-style:italic;color:var(--snow);margin-bottom:28px}

/* Form */
.form-group{margin-bottom:20px}
.form-label{display:block;font-size:11px;color:var(--silver);letter-spacing:0.15em;text-transform:uppercase;margin-bottom:8px}
.form-input,.form-textarea,.form-select{width:100%;background:rgba(8,9,15,0.6);border:1px solid rgba(163,172,208,0.1);color:var(--mist);font-family:var(--font-body);font-size:13px;padding:12px 16px;transition:border-color 0.3s;outline:none;font-weight:var(--weight-light)}
.form-input:focus,.form-textarea:focus{border-color:var(--frost)}
.form-textarea{min-height:120px;resize:vertical;line-height:1.7}
.form-input-file{display:none}
.form-file-label{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:1px dashed rgba(163,172,208,0.15);color:var(--silver);font-size:12px;cursor:pointer;transition:all 0.3s}
.form-file-label:hover{border-color:var(--frost);color:var(--frost)}
.form-file-preview{margin-top:10px;max-width:200px;max-height:150px;object-fit:cover;border:1px solid var(--line-art)}
.form-actions{display:flex;gap:12px;margin-top:28px}
.btn-primary{background:rgba(163,172,208,0.1);border:1px solid var(--frost);color:var(--frost);font-size:12px;letter-spacing:0.1em;padding:10px 24px;cursor:pointer;transition:all 0.3s;font-family:var(--font-body)}.btn-primary:hover{background:rgba(163,172,208,0.2);color:var(--snow)}.btn-primary:disabled{opacity:0.3;cursor:not-allowed}
.btn-secondary{background:none;border:1px solid rgba(163,172,208,0.1);color:var(--silver);font-size:12px;letter-spacing:0.1em;padding:10px 24px;cursor:pointer;transition:all 0.3s;font-family:var(--font-body)}.btn-secondary:hover{color:var(--mist);border-color:rgba(163,172,208,0.2)}
.btn-danger{background:none;border:1px solid rgba(196,112,112,0.3);color:var(--danger);font-size:12px;letter-spacing:0.1em;padding:10px 24px;cursor:pointer;transition:all 0.3s;font-family:var(--font-body)}.btn-danger:hover{background:rgba(196,112,112,0.1)}

/* Dynamic link editor */
.link-entry{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.link-entry .form-input{flex:1}
.link-remove-btn{background:none;border:1px solid rgba(196,112,112,0.2);color:var(--danger);width:32px;height:40px;cursor:pointer;font-size:14px;transition:all 0.3s;flex-shrink:0}.link-remove-btn:hover{background:rgba(196,112,112,0.1)}
.link-add-btn{background:none;border:1px dashed rgba(163,172,208,0.15);color:var(--silver);font-size:11px;padding:8px 16px;cursor:pointer;transition:all 0.3s;font-family:var(--font-body);width:100%}.link-add-btn:hover{border-color:var(--frost);color:var(--frost)}

/* Detail View */
.detail-view{display:none;min-height:100%;padding:60px 80px;animation:fadeIn 0.6s var(--ease-out)}.detail-view.active{display:block}
.detail-back{background:none;border:none;color:var(--silver);font-size:12px;letter-spacing:0.1em;cursor:pointer;margin-bottom:32px;transition:color 0.3s;font-family:var(--font-body);display:inline-flex;align-items:center;gap:6px}.detail-back:hover{color:var(--frost)}
.detail-title{font-family:var(--font-display);font-size:32px;font-weight:var(--weight-light);font-style:italic;color:var(--snow);margin-bottom:12px}
.detail-date{font-size:11px;color:var(--silver);letter-spacing:0.15em;margin-bottom:40px}
.detail-content{font-size:14px;color:var(--mist);line-height:2;white-space:pre-wrap}
.detail-content h1,.detail-content h2,.detail-content h3{font-family:var(--font-display);color:var(--snow);margin:24px 0 12px}
.detail-content h1{font-size:28px}.detail-content h2{font-size:22px}.detail-content h3{font-size:18px}

/* Login */
.login-trigger{position:fixed;bottom:calc(var(--player-height) + 12px);right:12px;background:none;border:none;color:var(--silver);opacity:0.15;font-size:10px;cursor:pointer;z-index:90;transition:opacity 0.3s;padding:4px}.login-trigger:hover{opacity:0.5}
body.is-admin .login-trigger{opacity:0.6;color:var(--aurora)}
.admin-badge{display:none;position:fixed;top:12px;right:12px;background:rgba(143,184,203,0.1);border:1px solid rgba(143,184,203,0.2);color:var(--aurora);font-size:10px;letter-spacing:0.15em;padding:5px 12px;z-index:100}body.is-admin .admin-badge{display:block}

/* Player */
.music-player{position:fixed;bottom:0;left:0;right:0;height:var(--player-height);background:rgba(8,9,15,0.92);backdrop-filter:blur(20px);border-top:1px solid var(--line-art);display:flex;align-items:center;padding:0 24px 0 calc(var(--nav-width) + 24px);gap:20px;z-index:200}
.player-album-art{width:44px;height:44px;border-radius:50%;background:var(--deep);border:1px solid rgba(163,172,208,0.08);overflow:hidden;flex-shrink:0;position:relative}
.player-album-art.spinning{animation:lp-spin 8s linear infinite}@keyframes lp-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.player-album-img{width:100%;height:100%;object-fit:cover}
.player-album-art::after{content:'';position:absolute;top:50%;left:50%;width:8px;height:8px;background:var(--void);border-radius:50%;transform:translate(-50%,-50%);border:1px solid rgba(163,172,208,0.1)}
.player-info{flex:0 0 180px;min-width:0}
.player-track-name{font-size:12.5px;color:var(--mist);font-weight:var(--weight-regular);letter-spacing:-0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-playlist-name{font-size:10px;color:var(--silver);letter-spacing:0.08em;margin-top:2px}
.player-controls{display:flex;align-items:center;gap:18px}
.player-btn{background:none;border:none;cursor:pointer;color:var(--frost);opacity:0.4;transition:all 0.3s;display:flex;align-items:center;justify-content:center;padding:0}.player-btn:hover{opacity:0.9;transform:scale(1.1)}
.player-btn svg{width:16px;height:16px;fill:currentColor}.player-btn.play-btn svg{width:22px;height:22px}.player-btn.active{opacity:1;color:var(--aurora)}
.player-progress-area{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.player-time{font-size:10px;color:var(--silver);letter-spacing:0.05em;font-variant-numeric:tabular-nums;flex-shrink:0;width:36px;text-align:center}
.player-progress-bar{flex:1;height:20px;display:flex;align-items:center;cursor:pointer;position:relative}
.player-progress-track{width:100%;height:1.5px;background:rgba(163,172,208,0.1);position:relative;pointer-events:none}
.player-progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--frost),var(--aurora));position:relative;transition:width 0.25s linear;box-shadow:0 0 6px rgba(143,184,203,0.3)}
.player-progress-fill::after{content:'';position:absolute;right:-3px;top:50%;width:6px;height:6px;background:var(--aurora);transform:translateY(-50%) rotate(45deg);box-shadow:0 0 8px var(--aurora);opacity:0;transition:opacity 0.3s}
.player-progress-bar:hover .player-progress-fill::after{opacity:1}
.player-volume{display:flex;align-items:center;gap:8px;opacity:0.4;transition:opacity 0.3s}.player-volume:hover{opacity:1}
.player-volume svg{width:14px;height:14px;fill:var(--frost);flex-shrink:0}
.player-volume input[type="range"]{-webkit-appearance:none;width:60px;height:1.5px;background:rgba(163,172,208,0.15);outline:none;cursor:pointer}
.player-volume input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:6px;height:6px;background:var(--frost);transform:rotate(45deg);cursor:pointer}

/* Toast */
.toast-container{position:fixed;bottom:calc(var(--player-height) + 16px);left:50%;transform:translateX(-50%);z-index:999}
.toast-msg{background:rgba(14,16,25,0.92);backdrop-filter:blur(12px);border:1px solid rgba(163,172,208,0.12);color:var(--mist);font-size:11px;letter-spacing:0.1em;padding:10px 20px;opacity:0;transform:translateY(8px);transition:all 0.4s var(--ease-out);pointer-events:none}.toast-msg.show{opacity:1;transform:translateY(0)}
.spinner{display:inline-block;width:16px;height:16px;border:1.5px solid rgba(163,172,208,0.2);border-top-color:var(--frost);border-radius:50%;animation:spin 0.6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* Responsive */
@media(max-width:768px){
  :root{--nav-width:0px}.nav-dock{display:none}.page-section,.detail-view{padding:40px 24px}.music-player{padding:0 16px}.player-info{flex:0 0 120px}.player-volume{display:none}
  .board-grid{grid-template-columns:1fr}.image-grid,.banner-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.modal-box{padding:28px 20px}
  .mobile-nav{display:flex!important;position:fixed;bottom:var(--player-height);left:0;right:0;height:52px;background:rgba(8,9,15,0.95);border-top:1px solid var(--line-art);z-index:150;align-items:center;justify-content:space-around;overflow-x:auto}
  .main-content{height:calc(100vh - var(--player-height) - 52px);margin-left:0}.gb-form-row{flex-direction:column}
}.mobile-nav{display:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}#particle-canvas{display:none}}

<script>
const PALELY_URL='https://lwudusogucvuiwglulzh.supabase.co';
const PALELY_KEY='sb_publishable_CEJvz8BuMNn2XO34mvR4Jw_4PduWouH';
const PMB_URL='https://zrfasztpsmprfpslizac.supabase.co';
const PMB_KEY='sb_publishable_z7m5HVzuiUhBzRKIAuOKZQ_y4PFw-6B';
let palelyDB=null,pmbClient=null,currentUser=null,isAdmin=false;
let currentEditorType=null,currentEditId=null,previousPage='home';
let currentPromptTab='nai',gbDeleteTarget=null;
let logsAllData=[],logsActiveCategory='all';

// ══ INIT ══
window.addEventListener('DOMContentLoaded',async()=>{
  try{palelyDB=window.supabase.createClient(PALELY_URL,PALELY_KEY);pmbClient=window.supabase.createClient(PMB_URL,PMB_KEY);}catch(e){}
  await checkAuth();await loadBoards();
  const h=window.location.hash.slice(1);if(h)navigate(h);
});

// ══ AUTH ══
async function checkAuth(){if(!palelyDB)return;try{const{data:{user}}=await palelyDB.auth.getUser();if(user){currentUser=user;isAdmin=true;document.body.classList.add('is-admin');}}catch(e){}}
function toggleLoginModal(){document.getElementById('login-modal').classList.toggle('active');document.getElementById('login-error').textContent='';}
function closeModal(id){document.getElementById(id).classList.remove('active');}
async function doLogin(){
  const e=document.getElementById('login-email').value.trim(),p=document.getElementById('login-password').value,err=document.getElementById('login-error'),btn=document.getElementById('login-btn');
  if(!e||!p){err.textContent='Email and password required';return;}btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
  try{const{data,error}=await palelyDB.auth.signInWithPassword({email:e,password:p});if(error)throw error;currentUser=data.user;isAdmin=true;document.body.classList.add('is-admin');closeModal('login-modal');showToast('Admin logged in');await loadBoards();}catch(e){err.textContent=e.message||'Login failed';}
  btn.disabled=false;btn.textContent='LOGIN';
}
async function doLogout(){if(!palelyDB)return;await palelyDB.auth.signOut();currentUser=null;isAdmin=false;document.body.classList.remove('is-admin');closeModal('login-modal');showToast('Logged out');}

// ══ ROUTER ══
function navigate(page){
  document.getElementById('detail-view').classList.remove('active');document.getElementById('detail-view').style.display='none';
  document.querySelectorAll('.page-section').forEach(s=>{s.classList.remove('active');s.style.display='';});
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const t=document.getElementById('page-'+page);if(t){t.classList.add('active');t.style.animation='none';t.offsetHeight;t.style.animation='';}
  document.querySelectorAll(`.nav-item[data-page="${page}"]`).forEach(n=>n.classList.add('active'));
  document.getElementById('main-content').scrollTop=0;window.location.hash=page;previousPage=page;
}
window.addEventListener('hashchange',()=>{navigate(window.location.hash.slice(1)||'home');});

// ══ TOAST ══
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

// ══ IMAGE PROTECTION ══
document.addEventListener('contextmenu',e=>{if(e.target.tagName==='IMG'&&!isAdmin){e.preventDefault();showToast('이미지 저장이 제한됩니다');}});

// ══ LOAD ALL BOARDS ══
async function loadBoards(){if(!palelyDB)return;await Promise.all([loadDiary(),loadAssets(),loadBanners(),loadLogs(),loadPrompts(),loadDistributions(),loadGuestbook()]);}

// ── Diary ──
async function loadDiary(){
  const{data}=await palelyDB.from('diary').select('*').order('created_at',{ascending:false});
  const g=document.getElementById('diary-grid');
  if(!data||!data.length){g.innerHTML=emptyHtml('diary');return;}
  g.innerHTML=data.map(d=>`<div class="board-card" onclick="openDetail('diary','${d.id}')"><div class="card-admin-controls"><button class="card-ctrl-btn" onclick="event.stopPropagation();openEditor('diary','${d.id}')">✎</button><button class="card-ctrl-btn delete" onclick="event.stopPropagation();confirmDelete('diary','${d.id}')">✕</button></div><div class="card-date">${fmtDate(d.created_at)}</div><div class="card-title">${esc(d.title)}</div><div class="card-excerpt">${esc(d.content||'')}</div></div>`).join('');
}

// ── Assets ──

// ── Logs (with category filter) ──
async function loadLogs(){
  const{data}=await palelyDB.from('logs').select('*').order('created_at',{ascending:false});
  logsAllData=data||[];
  buildLogCategories();renderLogs();
}
function buildLogCategories(){
  const cats=new Set();logsAllData.forEach(l=>{if(l.category)cats.add(l.category);});
  const cf=document.getElementById('logs-categories');
  if(cats.size===0){cf.innerHTML='';return;}
  cf.innerHTML=`<button class="cat-btn ${logsActiveCategory==='all'?'active':''}" onclick="filterLogs('all')">ALL</button>`+
    [...cats].map(c=>`<button class="cat-btn ${logsActiveCategory===c?'active':''}" onclick="filterLogs('${esc(c)}')">${esc(c)}</button>`).join('');
}
function filterLogs(cat){logsActiveCategory=cat;buildLogCategories();renderLogs();}
function renderLogs(){
  const g=document.getElementById('logs-grid');
  const filtered=logsActiveCategory==='all'?logsAllData:logsAllData.filter(l=>l.category===logsActiveCategory);
  if(!filtered.length){g.innerHTML=emptyHtml('logs');return;}
  g.innerHTML=filtered.map(l=>`<div class="board-card" onclick="openDetail('logs','${l.id}')"><div class="card-admin-controls"><button class="card-ctrl-btn" onclick="event.stopPropagation();openEditor('logs','${l.id}')">✎</button><button class="card-ctrl-btn delete" onclick="event.stopPropagation();confirmDelete('logs','${l.id}')">✕</button></div><div class="card-date">${fmtDate(l.created_at)}${l.category?' · '+esc(l.category):''}${l.source?' · '+esc(l.source):''}</div><div class="card-title">${esc(l.title)}</div><div class="card-excerpt">${esc(l.content||'')}</div>${l.tags&&l.tags.length?l.tags.map(t=>'<span class="card-tag">'+esc(t)+'</span>').join(''):''}</div>`).join('');
}

// ── Guestbook ──
async function loadGuestbook(){
  const{data}=await palelyDB.from('guestbook').select('*').order('created_at',{ascending:false});
  const g=document.getElementById('guestbook-list');
  if(!data||!data.length){g.innerHTML='<div class="empty-state"><p class="empty-state-text">아직 방명록이 없습니다</p></div>';return;}
  g.innerHTML=data.map(e=>`<div class="gb-entry"><button class="gb-del" onclick="openGbDelete('${e.id}')">DELETE</button><div class="gb-nickname">${esc(e.nickname)}</div><div class="gb-content">${esc(e.content)}</div><div class="gb-date">${fmtDate(e.created_at)}</div></div>`).join('');
}
async function submitGuestbook(){
  const nick=document.getElementById('gb-nickname').value.trim();
  const pw=document.getElementById('gb-password').value;
  const content=document.getElementById('gb-content').value.trim();
  if(!nick||!pw||!content){showToast('모든 필드를 입력해주세요');return;}
  const btn=document.getElementById('gb-submit');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
  try{
    const hash=await hashPw(pw);
    const{error}=await palelyDB.from('guestbook').insert({nickname:nick,password_hash:hash,content:content});
    if(error)throw error;
    document.getElementById('gb-nickname').value='';document.getElementById('gb-password').value='';document.getElementById('gb-content').value='';
    showToast('방명록이 등록되었습니다');await loadGuestbook();
  }catch(e){showToast('Error: '+e.message);}
  btn.disabled=false;btn.textContent='WRITE';
}
function openGbDelete(id){
  if(isAdmin){if(confirm('관리자 권한으로 삭제하시겠습니까?')){deleteGbDirect(id);}return;}
  gbDeleteTarget=id;document.getElementById('gb-del-pw').value='';document.getElementById('gb-del-error').textContent='';
  document.getElementById('gb-delete-modal').classList.add('active');
}
async function confirmGbDelete(){
  const pw=document.getElementById('gb-del-pw').value;if(!pw){document.getElementById('gb-del-error').textContent='비밀번호를 입력하세요';return;}
  const hash=await hashPw(pw);
  const{data}=await palelyDB.from('guestbook').select('password_hash').eq('id',gbDeleteTarget).single();
  if(!data||data.password_hash!==hash){document.getElementById('gb-del-error').textContent='비밀번호가 일치하지 않습니다';return;}
  await deleteGbDirect(gbDeleteTarget);closeModal('gb-delete-modal');
}
async function deleteGbDirect(id){
  try{await palelyDB.from('guestbook').delete().eq('id',id);showToast('삭제됨');await loadGuestbook();}catch(e){showToast('삭제 실패');}
}
async function hashPw(pw){const enc=new TextEncoder().encode(pw);const buf=await crypto.subtle.digest('SHA-256',enc);return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}

// ══ DETAIL VIEW ══
async function openDetail(type,id){
  if(!palelyDB)return;const{data}=await palelyDB.from(type).select('*').eq('id',id).single();if(!data)return;
  document.querySelectorAll('.page-section').forEach(s=>s.style.display='none');
  const dv=document.getElementById('detail-view');dv.style.display='block';dv.classList.add('active');
  document.getElementById('detail-title').textContent=data.title||'';
  document.getElementById('detail-date').textContent=fmtDate(data.created_at)+(data.category?' · '+data.category:'')+(data.source?' · '+data.source:'');
  const contentEl=document.getElementById('detail-content');
  contentEl.innerHTML=renderContent(data.content||data.prompt_text||'');
  const aa=document.getElementById('detail-admin-actions');
  aa.innerHTML=isAdmin?`<button class="btn-secondary" onclick="openEditor('${type}','${id}')">EDIT</button><button class="btn-danger" style="margin-left:8px;" onclick="confirmDelete('${type}','${id}')">DELETE</button>`:'';
  document.getElementById('main-content').scrollTop=0;
}
function closeDetail(){document.getElementById('detail-view').style.display='none';document.getElementById('detail-view').classList.remove('active');navigate(previousPage);}
function renderContent(text){return esc(text).replace(/\n/g,'<br>');}

// ══ EDITOR ══
let editorDistType=null;
async function openEditor(type,editId,distType){
  currentEditorType=type;currentEditId=editId||null;editorDistType=distType||null;
  const titleEl=document.getElementById('editor-title'),fieldsEl=document.getElementById('editor-fields'),delBtn=document.getElementById('editor-delete-btn');
  delBtn.style.display=editId?'inline-block':'none';
  let existingData=null;
  if(editId){const{data}=await palelyDB.from(type).select('*').eq('id',editId).single();existingData=data;if(type==='distributions'&&existingData)editorDistType=existingData.type;}
  const fields=getFieldsForType(type,editorDistType);
  titleEl.textContent=(editId?'Edit':'New')+' '+typeLabel(type,editorDistType);
  fieldsEl.innerHTML=fields.map(f=>{
    const val=existingData?(existingData[f.key]||''):'';
    if(f.type==='textarea')return `<div class="form-group"><label class="form-label">${f.label}</label><textarea class="form-textarea" id="ef-${f.key}" placeholder="${f.placeholder||''}">${esc(Array.isArray(val)?val.join(', '):val)}</textarea></div>`;
    if(f.type==='file')return `<div class="form-group"><label class="form-label">${f.label}</label><label class="form-file-label"><span>📎 파일 선택</span><input type="file" class="form-input-file" id="ef-${f.key}" accept="image/*" onchange="previewFile(this)"></label>${existingData&&existingData[f.key]?'<img class="form-file-preview" id="ef-preview" src="'+esc(existingData[f.key])+'">':'<img class="form-file-preview" id="ef-preview" style="display:none;">'}</div>`;
    if(f.type==='url-og')return `<div class="form-group"><label class="form-label">${f.label}</label><div style="display:flex;gap:8px;"><input type="url" class="form-input" id="ef-${f.key}" value="${esc(val)}" placeholder="${f.placeholder||''}"><button class="btn-secondary" style="flex-shrink:0;padding:10px 12px;" onclick="fetchOG()">FETCH</button></div><img class="form-file-preview" id="ef-og-preview" ${existingData&&existingData.image_url?'src="'+esc(existingData.image_url)+'"':'style="display:none;"'}></div>`;
    if(f.type==='links'){
      const links=existingData?existingData.links||[]:[{label:'',url:''}];
      return `<div class="form-group"><label class="form-label">${f.label}</label><div id="ef-links-container">${links.map((l,i)=>`<div class="link-entry"><input type="text" class="form-input" placeholder="Label" value="${esc(l.label||'')}" data-link-label="${i}"><input type="url" class="form-input" placeholder="URL" value="${esc(l.url||'')}" data-link-url="${i}"><button class="link-remove-btn" onclick="this.parentElement.remove()">✕</button></div>`).join('')}</div><button class="link-add-btn" onclick="addLinkEntry()">+ Add Link</button></div>`;
    }
    return `<div class="form-group"><label class="form-label">${f.label}</label><input type="text" class="form-input" id="ef-${f.key}" value="${esc(Array.isArray(val)?val.join(', '):val)}" placeholder="${f.placeholder||''}"></div>`;
  }).join('');
  document.getElementById('editor-modal').classList.add('active');
}

function getFieldsForType(type,distType){
  switch(type){
    case 'diary':return [{key:'title',label:'Title',type:'text',placeholder:'제목'},{key:'content',label:'Content',type:'textarea',placeholder:'내용...'}];
    case 'assets':return [{key:'title',label:'Title',type:'text',placeholder:'에셋 이름 (선택)'},{key:'image_url',label:'Image',type:'file'},{key:'tags',label:'Tags',type:'text',placeholder:'태그1, 태그2'}];
    case 'banners':return [{key:'link_url',label:'Link URL',type:'url-og',placeholder:'https://...'},{key:'title',label:'Title',type:'text',placeholder:'사이트 이름 (선택)'}];
    case 'logs':return [{key:'title',label:'Title',type:'text',placeholder:'제목'},{key:'category',label:'Category',type:'text',placeholder:'카테고리'},{key:'source',label:'Source',type:'text',placeholder:'출처 (선택)'},{key:'tags',label:'Tags',type:'text',placeholder:'태그1, 태그2'},{key:'content',label:'Content',type:'textarea',placeholder:'로그 내용...'}];
    case 'prompts':return [{key:'title',label:'Title',type:'text',placeholder:'프롬프트 이름 (선택)'},{key:'category',label:'Category',type:'text',placeholder:'카테고리'},{key:'prompt_text',label:'Prompt',type:'textarea',placeholder:'프롬프트 텍스트...'},{key:'tags',label:'Tags',type:'text',placeholder:'태그1, 태그2'}];
    case 'distributions':return [{key:'title',label:'Title',type:'text',placeholder:'이름'},{key:'image_url',label:'Image',type:'file'},{key:'description',label:'Description',type:'textarea',placeholder:'설명...'},{key:'links',label:'Links',type:'links'}];
    default:return[];
  }
}

function addLinkEntry(){
  const c=document.getElementById('ef-links-container');if(!c)return;
  const d=document.createElement('div');d.className='link-entry';
  d.innerHTML=`<input type="text" class="form-input" placeholder="Label"><input type="url" class="form-input" placeholder="URL"><button class="link-remove-btn" onclick="this.parentElement.remove()">✕</button>`;
  c.appendChild(d);
}

function previewFile(input){const p=document.getElementById('ef-preview');if(input.files&&input.files[0]){const r=new FileReader();r.onload=e=>{p.src=e.target.result;p.style.display='block';};r.readAsDataURL(input.files[0]);}}

async function fetchOG(){
  const urlInput=document.getElementById('ef-link_url');if(!urlInput)return;
  const url=urlInput.value.trim();if(!url){showToast('URL을 입력하세요');return;}
  const preview=document.getElementById('ef-og-preview');
  try{
    const resp=await fetch('https://api.microlink.io/?url='+encodeURIComponent(url));
    const json=await resp.json();
    if(json.status==='success'&&json.data){
      const img=json.data.image?.url||json.data.logo?.url||'';
      const title=json.data.title||'';
      if(img){preview.src=img;preview.style.display='block';preview.dataset.ogUrl=img;}
      if(title&&!document.getElementById('ef-title').value)document.getElementById('ef-title').value=title;
      showToast('OG 데이터 로드 완료');
    }else{showToast('미리보기를 가져올 수 없습니다');}
  }catch(e){showToast('Fetch failed');}
}

async function saveEntry(){
  if(!palelyDB||(!isAdmin&&currentEditorType!=='guestbook')){showToast('Admin login required');return;}
  const btn=document.getElementById('editor-save-btn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
  try{
    const fields=getFieldsForType(currentEditorType,editorDistType);const record={};
    for(const f of fields){
      if(f.type==='file'){
        const fi=document.getElementById('ef-'+f.key);
        if(fi&&fi.files&&fi.files[0]){
          const file=fi.files[0],ext=file.name.split('.').pop();
          const fn=`${currentEditorType}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
          const{error:ue}=await palelyDB.storage.from('images').upload(fn,file,{contentType:file.type});if(ue)throw ue;
          const{data:ud}=palelyDB.storage.from('images').getPublicUrl(fn);record[f.key]=ud.publicUrl;
        }else if(currentEditId)continue;
      }else if(f.type==='url-og'){
        record[f.key]=document.getElementById('ef-'+f.key)?.value?.trim()||'';
        const ogPrev=document.getElementById('ef-og-preview');
        if(ogPrev&&ogPrev.dataset.ogUrl)record.image_url=ogPrev.dataset.ogUrl;
        else if(!currentEditId)record.image_url=record[f.key]?'https://api.microlink.io/screenshot?url='+encodeURIComponent(record[f.key]):'';
      }else if(f.type==='links'){
        const entries=document.querySelectorAll('#ef-links-container .link-entry');
        const links=[];entries.forEach(e=>{
          const inputs=e.querySelectorAll('input');
          const label=inputs[0]?.value?.trim()||'';const url=inputs[1]?.value?.trim()||'';
          if(url)links.push({label:label||url,url});
        });record.links=links;
      }else{
        let val=document.getElementById('ef-'+f.key)?.value?.trim()||'';
        if(f.key==='tags')record[f.key]=val?val.split(',').map(t=>t.trim()).filter(Boolean):[];
        else record[f.key]=val;
      }
    }
    if(currentEditorType==='distributions'&&!currentEditId)record.type=editorDistType;
    if(currentEditId){
      record.updated_at=new Date().toISOString();
      const{error}=await palelyDB.from(currentEditorType).update(record).eq('id',currentEditId);if(error)throw error;showToast('Updated');
    }else{
      const{error}=await palelyDB.from(currentEditorType).insert(record);if(error)throw error;showToast('Created');
    }
    closeModal('editor-modal');await loadBoardByType(currentEditorType);
  }catch(e){showToast('Error: '+(e.message||'Save failed'));console.error(e);}
  btn.disabled=false;btn.textContent='SAVE';
}

async function confirmDelete(type,id){if(!confirm('정말 삭제하시겠습니까?'))return;await deleteEntryDirect(type,id);}
async function deleteEntry(){if(!currentEditId||!confirm('정말 삭제하시겠습니까?'))return;await deleteEntryDirect(currentEditorType,currentEditId);closeModal('editor-modal');}
async function deleteEntryDirect(type,id){
  if(!palelyDB||!isAdmin)return;try{await palelyDB.from(type).delete().eq('id',id);showToast('Deleted');await loadBoardByType(type);
  if(document.getElementById('detail-view').style.display==='block')closeDetail();}catch(e){showToast('Delete failed');}
}
async function loadBoardByType(t){
  switch(t){case 'diary':await loadDiary();break;case 'assets':await loadAssets();break;case 'banners':await loadBanners();break;case 'logs':await loadLogs();break;case 'prompts':await loadPrompts();break;case 'distributions':await loadDistributions();break;case 'guestbook':await loadGuestbook();break;}
}

// ══ UTILS ══
function viewImage(url){document.getElementById('image-viewer-img').src=url;document.getElementById('image-viewer-modal').classList.add('active');}
function copyPrompt(btn,enc){const t=decodeURIComponent(atob(enc));navigator.clipboard.writeText(t).then(()=>{btn.textContent='COPIED';btn.classList.add('copied');showToast('클립보드에 복사됨');setTimeout(()=>{btn.textContent='COPY';btn.classList.remove('copied');},1500);});}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function fmtDate(d){return new Date(d).toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'});}
function typeLabel(t,dt){return{diary:'Diary',assets:'Asset',banners:'Banner',logs:'Log',prompts:'Prompt',distributions:dt==='caveduck'?'CaveDuck':'Utility',guestbook:'Guestbook'}[t]||t;}
function emptyHtml(type){
  const labels={diary:'기록이',assets:'에셋이',banners:'배너가',logs:'로그가',prompts:'프롬프트가',caveduck:'CaveDuck 배포가',utility:'유틸리티가'};
  return `<div class="empty-state" style="grid-column:1/-1;"><p class="empty-state-text">아직 ${labels[type]||'항목이'} 없습니다</p></div>`;
}

// ══ PARTICLES ══
(function(){
  const c=document.getElementById('particle-canvas'),x=c.getContext('2d');let ps=[],W,H;
  function rz(){W=c.width=innerWidth;H=c.height=innerHeight;}rz();addEventListener('resize',rz);
  for(let i=0;i<120;i++)ps.push({t:'s',x:Math.random()*W,y:Math.random()*H,sz:Math.random()*1.5+.5,a:Math.random()*.4,at:Math.random()*.6+.1,sp:Math.random()*.005+.002,ph:Math.random()*Math.PI*2});
  for(let i=0;i<40;i++)ps.push({t:'n',x:Math.random()*W,y:Math.random()*H,sz:Math.random()*2+.5,a:Math.random()*.25+.05,sy:Math.random()*.3+.1,sx:Math.random()*.2-.1,w:Math.random()*Math.PI*2,ws:Math.random()*.01+.005});
  (function anim(){x.clearRect(0,0,W,H);ps.forEach(p=>{if(p.t==='s'){p.ph+=p.sp;p.a+=(p.at-p.a)*.01;if(Math.random()<.002)p.at=Math.random()*.6+.1;x.globalAlpha=p.a*(Math.sin(p.ph)*.5+.5);x.fillStyle='#c8d0e8';x.beginPath();x.arc(p.x,p.y,p.sz,0,Math.PI*2);x.fill();}else{p.w+=p.ws;p.x+=p.sx+Math.sin(p.w)*.15;p.y+=p.sy;if(p.y>H+10){p.y=-10;p.x=Math.random()*W;}if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10;x.globalAlpha=p.a;x.fillStyle='#e4e7f1';x.beginPath();x.arc(p.x,p.y,p.sz,0,Math.PI*2);x.fill();}});x.globalAlpha=1;requestAnimationFrame(anim);})();
})();

// ══ MUSIC PLAYER ══
let ytPlayer=null,pmbTracks=[],pmbIdx=-1,pmbPlaying=false,pmbShuffle=false,pmbPlayed={},pmbPI=null;
function loadYTAPI(){const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);}loadYTAPI();
window.onYouTubeIframeAPIReady=function(){ytPlayer=new YT.Player('yt-player-container',{height:'0',width:'0',playerVars:{playsinline:1},events:{onReady:function(){const v=document.getElementById('player-volume-slider');if(v&&ytPlayer)ytPlayer.setVolume(parseInt(v.value));initPMB();},onStateChange:onYTS}});};
function onYTS(e){const a=document.getElementById('player-art'),iP=document.getElementById('p-icon-play'),iPa=document.getElementById('p-icon-pause');if(e.data===YT.PlayerState.PLAYING){pmbPlaying=true;a.classList.add('spinning');iP.style.display='none';iPa.style.display='block';startProg();}else{pmbPlaying=false;a.classList.remove('spinning');iP.style.display='block';iPa.style.display='none';clearInterval(pmbPI);}if(e.data===YT.PlayerState.ENDED)playerNext();}
function startProg(){clearInterval(pmbPI);pmbPI=setInterval(()=>{if(ytPlayer&&pmbPlaying&&ytPlayer.getCurrentTime){try{const c=ytPlayer.getCurrentTime(),d=ytPlayer.getDuration();if(d>0){document.getElementById('player-progress-fill').style.width=(c/d*100)+'%';document.getElementById('player-time-cur').textContent=fT(c);document.getElementById('player-time-dur').textContent=fT(d);}}catch(e){}}},250);}
function fT(s){if(!s)return'0:00';const m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+(ss<10?'0':'')+ss;}
async function initPMB(){if(!pmbClient)return;try{const{data:p}=await pmbClient.from('playlists').select('*').limit(1);if(p&&p.length){document.getElementById('player-playlist-name').textContent=p[0].pair_name||'PMB';const{data:t}=await pmbClient.from('tracks').select('*').eq('playlist_id',p[0].id).order('position');if(t&&t.length){pmbTracks=t.map(x=>({id:x.id,vid:x.video_id,title:x.title,img:x.image_url||null}));pmbPlay(0);}}}catch(e){}}
function pmbPlay(i){if(i<0||i>=pmbTracks.length)return;pmbIdx=i;const t=pmbTracks[i];if(ytPlayer&&ytPlayer.loadVideoById)ytPlayer.loadVideoById(t.vid);document.getElementById('player-track-name').textContent=t.title;const img=t.img||(t.vid?'https://img.youtube.com/vi/'+t.vid+'/mqdefault.jpg':'');if(img)document.getElementById('player-art').innerHTML='<img class="player-album-img" src="'+img+'" draggable="false">';}
function playerToggle(){if(pmbIdx===-1&&pmbTracks.length)pmbPlay(0);else if(ytPlayer&&ytPlayer.getPlayerState)pmbPlaying?ytPlayer.pauseVideo():ytPlayer.playVideo();}
function playerNext(){if(!pmbTracks.length)return;let n;if(pmbShuffle){const a=[];for(let i=0;i<pmbTracks.length;i++)if(i!==pmbIdx&&!pmbPlayed[i])a.push(i);if(!a.length){pmbPlayed={};for(let i=0;i<pmbTracks.length;i++)if(i!==pmbIdx)a.push(i);}n=a[Math.floor(Math.random()*a.length)];}else n=(pmbIdx+1)%pmbTracks.length;pmbPlayed[n]=true;pmbPlay(n);}
function playerPrev(){if(pmbTracks.length)pmbPlay((pmbIdx-1+pmbTracks.length)%pmbTracks.length);}
function playerToggleShuffle(){pmbShuffle=!pmbShuffle;pmbPlayed={};document.getElementById('player-shuffle-btn').classList.toggle('active',pmbShuffle);showToast(pmbShuffle?'Shuffle ON':'Shuffle OFF');}
function playerSetVolume(v){if(ytPlayer&&ytPlayer.setVolume)ytPlayer.setVolume(parseInt(v));}
document.getElementById('player-progress-bar').addEventListener('mousedown',function(e){sk(e);const mv=ev=>sk(ev),up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);};addEventListener('mousemove',mv);addEventListener('mouseup',up);});
function sk(e){const b=document.getElementById('player-progress-bar').getBoundingClientRect();let p=(e.clientX-b.left)/b.width;p=Math.max(0,Math.min(1,p));document.getElementById('player-progress-fill').style.width=(p*100)+'%';if(ytPlayer&&ytPlayer.getDuration)ytPlayer.seekTo(ytPlayer.getDuration()*p,true);}
</script>
</body>
